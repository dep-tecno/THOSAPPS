<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Sociograma de convivència</title>
  <desc id="desc">Nodes que representen persones connectades dins d'un grup.</desc>
  <defs>
