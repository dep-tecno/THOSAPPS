<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SECURITY: Content Security Policy — limita fonts de scripts/estils externs -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline' https://cdn.tailwindcss.com https://html2canvas.hertzen.com https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob:; font-src https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'none'">
    <title>THOSMap v2.0</title>
    <!-- SECURITY: cdn.tailwindcss.com és un CDN dinàmic (Play CDN) i no admet SRI estàtic -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@dagrejs/dagre@1.1.8/dist/dagre.min.js" integrity="sha384-APx0Be9S9z04dTSdhLIIDbTZcU5XrIh2mdU3KlrwJ6+r/5wn/XSXNb6BBAGWZ++D" crossorigin="anonymous"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
    <!-- FontAwesome per icones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha384-3B6NwesSXE7YJlcLI9RpRqGf2p/EgVH8BgoKTaUrmKNDkHPStTQ3EyoYjCGXaOTS" crossorigin="anonymous">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111827; /* Fons fosc (Gray 900) */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; 
            color: #f3f4f6;
        }

        #workspace {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: grab;
            /* Fons aplicat directament amb CSS inicial */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0;
            transform-origin: 0 0; 
        }

        #workspace.grabbing { cursor: grabbing; }

        #connections-layer, #nodes-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            transform-origin: 0 0; 
            overflow: visible;
        }

        .node { pointer-events: auto; }

        .connection-line {
            fill: none;
            stroke: #9ca3af;
            stroke-width: 2px;
            stroke-linecap: square; 
            stroke-linejoin: round;
            transition: d 0.1s ease;
        }

        .arrow-line {
            fill: none;
            stroke: #f87171;
            stroke-width: 2px;
            stroke-dasharray: 5, 5;
            marker-end: url(#arrowhead);
        }

        /* --- ESTILS NODE --- */
        .node {
            position: absolute;
            background: #1f2937;
            border-radius: 6px;
            padding: 8px 12px;
            min-width: 80px;
            max-width: 250px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            border: 1px solid #4b5563;
            z-index: 10;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px; 
            box-sizing: border-box; 
            transform: translate(-50%, -50%); 
            color: #f9fafb;
        }

        .node.root-node {
            background-color: #2563eb; 
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
        }

        .node:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border-color: #6b7280;
        }

        .node.selected {
            border: 3px solid #e879f9; 
            box-shadow: 0 0 15px rgba(232, 121, 249, 0.5); 
            z-index: 50; 
            transform: translate(-50%, -50%) scale(1.05);
        }

        /* --- MODE ESQUEMA (OUTLINE) --- */
        .mode-outline .node {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 2px 0px !important;
            min-width: auto !important;
            text-align: left;
            justify-content: flex-start;
            transform: translate(0, -50%) !important; 
            color: #e5e7eb !important; 
            cursor: move; 
        }
        
        #workspace.mode-outline {
            background-color: #111827 !important; 
        }

        .mode-outline .connection-line {
            stroke: #9ca3af !important; 
        }

        .mode-outline .node.root-node {
            font-size: inherit !important; 
            font-weight: 700 !important; 
            border: none !important;
            margin: 0 !important;
            color: #e5e7eb !important; 
            background: transparent !important;
            padding: 2px 5px !important;
        }

        .mode-outline .node.selected {
            background-color: rgba(255, 255, 255, 0.1) !important;
            border: 1px dashed #666 !important;
            border-radius: 4px;
            transform: translate(0, -50%) !important; 
        }

        .mode-outline .node:hover {
            text-decoration: underline;
            box-shadow: none !important;
        }

        .mode-outline .node-content { color: #e5e7eb !important; }

        .node.free-text, .mode-outline .node.free-text {
            background: transparent !important;
            border: 1px solid transparent !important;
            box-shadow: none !important;
            padding: 4px 8px !important;
            min-width: 80px;
            justify-content: flex-start;
            text-align: left;
            transform: translate(-50%, -50%) !important;
            cursor: move;
        }
        .node.free-text.selected, .mode-outline .node.free-text.selected {
            border: 1px dashed #e879f9 !important;
        }
        .node.free-text:hover { text-decoration: none; }
        .node.free-text .node-content { color: inherit !important; }

        .mode-flow .node.flow-node {
            background: transparent !important; border: 0; box-shadow: none;
            padding: 0; width: 180px; max-width: 600px; min-width: 140px;
            transform: translate(-50%, -50%) !important;
        }
        .flow-node .flow-content { position: relative; padding: 16px 24px; min-height: 72px; box-sizing: border-box; }
        .flow-node.flow-decision .flow-content { padding: 40px 26%; min-height: 150px; }
        .flow-node.flow-data .flow-content { padding-left: 30px; padding-right: 30px; }
        .flow-symbol { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
        .flow-symbol > * { stroke: #94a3b8; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
        .flow-node.selected .flow-symbol > * { stroke: #e879f9; stroke-width: 2.5; }
        .flow-node.linking-source .flow-symbol > * { stroke: #f87171; stroke-width: 2.5; }
        .mode-flow .flow-node.linking-source { border: 0 !important; animation: none; }
        .flow-only { display: none; }
        body[data-layout="flow"] #toolbar .map-only { display: none; }
        body[data-layout="flow"] #toolbar .flow-only { display: flex; }
        #flow-shape-menu { width: 190px; }
        #flow-label-menu { width: 210px; padding: 10px; }
        #flow-label-menu label { display: block; font-size: 13px; margin-bottom: 6px; }
        .flow-label-row { display: flex; gap: 4px; }
        #flow-edge-text { flex: 1; min-width: 0; color: #f9fafb; background: #111827; border: 1px solid #4b5563; padding: 6px; border-radius: 4px; }
        .canvas-dialog { position: fixed; inset: 0; z-index: 600; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center; }
        .canvas-dialog-panel { width: min(440px, calc(100% - 32px)); padding: 24px; background: #1f2937; border: 1px solid #4b5563; border-radius: 6px; }
        .canvas-dialog-panel h2 { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
        .canvas-dialog-panel p { font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        .canvas-dialog-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
        .canvas-dialog-actions button { padding: 8px 12px; border: 1px solid #4b5563; border-radius: 4px; background: #374151; color: #f9fafb; }
        .canvas-dialog-actions .danger { background: #991b1b; border-color: #b91c1c; }

        /* --- ELEMENTS ADICIONALS --- */
        .node.linking-source {
            border: 3px dashed #f87171 !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(248, 113, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0); }
        }

        .resize-handle {
            position: absolute; bottom: 0; right: 0; width: 15px; height: 15px;
            cursor: nwse-resize; 
            background: linear-gradient(135deg, transparent 50%, #9ca3af 50%);
            border-bottom-right-radius: 4px; display: none; z-index: 60;
        }
        .node.selected .resize-handle { display: block; }

        .node-content {
            outline: none; cursor: text; width: 100%; pointer-events: none; 
            word-wrap: break-word; line-height: 1.4;
            user-select: text; -webkit-user-select: text;
            white-space: pre-wrap; 
        }
        .node.selected .node-content { pointer-events: auto; }

        .node-img { width: 100%; height: auto; margin-bottom: 5px; display: block; pointer-events: none; }

        /* BARRA D'EINES */
        #toolbar {
            position: fixed; top: 0; left: 0; width: 100%;
            height: 56px;
            background: #1f2937; border-bottom: 1px solid #374151;
            display: flex; flex-wrap: nowrap; align-items: center; gap: 1px;
            padding: 0 6px; box-sizing: border-box; z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            overflow-x: auto;
            scrollbar-width: none;
        }
        
        #toolbar::-webkit-scrollbar { display: none; }
        .toolbar-brand { display: flex; align-items: center; flex-shrink: 0; margin-right: 2px; }

        .tool-btn {
            display: flex; align-items: center; justify-content: center; gap: 4px; background: transparent;
            flex-shrink: 0; min-width: 32px; height: 34px;
            border: 1px solid transparent;
            padding: 5px;
            margin-right: 0; border-radius: 4px;
            cursor: pointer; color: #d1d5db; 
            font-size: 13px; 
            font-weight: 500;
            transition: background 0.1s;
            white-space: nowrap; 
        }

        .tool-btn i { font-size: 16px; }

        .tool-btn:hover { background: #374151; color: #fff; }
        .tool-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .tool-btn:disabled:hover { background: transparent; color: #d1d5db; }
        .tool-btn.active { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
        
        .tool-separator { 
            width: 1px; height: 22px; background: #4b5563; margin: 0 4px; flex-shrink: 0;
        }

        @media (max-width: 1100px) {
            #toolbar .tool-label { display: none; }
            #toolbar .tool-separator { margin: 0 3px; }
        }

        .floating-menu {
            position: absolute; background: #1f2937; border: 1px solid #4b5563;
            padding: 5px 0; border-radius: 4px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); display: none; z-index: 200;
        }
        .color-picker-swatch {
            width: 20px; height: 20px; border-radius: 3px; border: 1px solid #4b5563;
            cursor: pointer; display: inline-block; margin: 2px;
        }
        #color-menu { width: 160px; padding: 8px; }
        #layout-menu { width: 250px; }
        #alignment-menu { width: 160px; }
        .alignment-choice { width: 100%; border: 0; background: transparent; text-align: left; }
        .alignment-choice[aria-checked="true"] { background: #374151; color: #fff; }
        
        .menu-item {
            padding: 8px 15px; cursor: pointer; font-size: 14px; color: #d1d5db;
            display: flex; align-items: center; gap: 8px;
        }
        .menu-item:hover { background-color: #374151; color: white; }

        #toast {
            position: fixed; bottom: 20px; right: 20px;
            background: #4b5563; color: white; padding: 12px 24px;
            border-radius: 6px; font-size: 15px; opacity: 0;
            transition: opacity 0.3s; pointer-events: none; z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        input[type="file"] { display: none; }
        #app-title { font-size: 1.25rem; font-weight: 700; letter-spacing: 0; white-space: nowrap; }

        #restore-dialog {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 500;
            display: flex; align-items: center; justify-content: center;
        }
        #restore-dialog .dialog-box {
            background: #1f2937; border: 1px solid #4b5563; border-radius: 10px;
            padding: 28px 32px; max-width: 360px; width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center;
        }
        #restore-dialog .dialog-icon { font-size: 2rem; margin-bottom: 12px; }
        #restore-dialog h2 { font-size: 1.1rem; font-weight: 700; color: #f9fafb; margin-bottom: 8px; }
        #restore-dialog p { font-size: 0.9rem; color: #9ca3af; margin-bottom: 24px; }
        #restore-dialog .dialog-btns { display: flex; gap: 12px; justify-content: center; }
        #restore-dialog .btn-yes {
            background: #2563eb; color: white; border: none; padding: 9px 24px;
            border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: 600;
        }
        #restore-dialog .btn-yes:hover { background: #1d4ed8; }
        #restore-dialog .btn-no {
            background: transparent; color: #9ca3af; border: 1px solid #4b5563;
            padding: 9px 24px; border-radius: 6px; cursor: pointer; font-size: 0.95rem;
        }
        #restore-dialog .btn-no:hover { background: #374151; color: #f9fafb; }
    </style>
</head>
<body>

    <div id="toolbar">
        <div class="toolbar-brand">
            <a id="app-title" href="https://tecno-apps.cat/" title="Torna a tecno-apps" aria-label="Torna a tecno-apps" class="inline-flex items-center no-underline" target="_top">
                <i class="fas fa-project-diagram mr-1" style="color:#60a5fa"></i><span style="color:#60a5fa">THOS</span><span class="text-white">MAP</span><span class="text-gray-400 text-sm font-normal ml-1">v2.0</span>
            </a>
        </div>
        <div class="tool-separator"></div>
        <button onclick="app.undo()" id="btn-undo" class="tool-btn" title="Desfer (Ctrl+Z)" disabled><i class="fas fa-undo"></i></button>
        <button onclick="app.redo()" id="btn-redo" class="tool-btn" title="Refer (Ctrl+Y)" disabled><i class="fas fa-redo"></i></button>
        <div class="tool-separator"></div>
        <button onclick="app.addChild()" class="tool-btn map-only" title="Afegir fill (Tab)" aria-label="Afegir fill"><i class="fas fa-sitemap"></i><span class="tool-label">Fill</span></button>
        <button onclick="app.addSibling()" class="tool-btn map-only" title="Afegir germà (Enter)" aria-label="Afegir germà"><i class="fas fa-plus"></i><span class="tool-label">Germà</span></button>
        <button onclick="app.addRootNode()" class="tool-btn map-only font-bold text-blue-400" title="Afegir pare" aria-label="Afegir pare"><i class="fas fa-star"></i><span class="tool-label">Pare</span></button>
        <button onclick="app.startFlowBlock()" id="btn-flow-add" class="tool-btn flow-only" title="Afegir bloc" aria-label="Afegir bloc" aria-pressed="false"><i class="fas fa-plus"></i><span class="tool-label">Bloc</span></button>
        <button onclick="app.toggleFlowMenu(event, 'flow-shape-menu')" class="tool-btn flow-only" title="Símbol del bloc" aria-label="Símbol del bloc"><i class="fas fa-shapes"></i></button>
        <button onclick="app.toggleFlowMenu(event, 'flow-label-menu')" id="btn-flow-label" class="tool-btn flow-only" title="Text de la fletxa" aria-label="Text de la fletxa" disabled><i class="fas fa-tag"></i></button>
        <button onclick="app.toggleTextMode()" id="btn-text" class="tool-btn" title="Afegir text lliure" aria-label="Afegir text lliure" aria-pressed="false"><i class="fas fa-font"></i><span class="tool-label">Text</span></button>
        <button onclick="app.deleteNode()" class="tool-btn text-red-400" title="Eliminar selecció" aria-label="Eliminar selecció"><i class="fas fa-trash-alt"></i></button>
        <div class="tool-separator"></div>
        
        <button onclick="app.zoomOut()" class="tool-btn" title="Zoom Out"><i class="fas fa-search-minus"></i></button>
        <button onclick="app.zoomIn()" class="tool-btn" title="Zoom In"><i class="fas fa-search-plus"></i></button>
        
        <div class="tool-separator"></div>
        <button onclick="app.toggleConnectMode()" id="btn-connect" class="tool-btn" title="Enllaçar nodes" aria-label="Enllaçar nodes"><i class="fas fa-long-arrow-alt-right"></i><span class="tool-label">Enllaç</span></button>
        <button onclick="app.toggleColorMenu(event)" class="tool-btn" title="Canviar color" aria-label="Canviar color"><i class="fas fa-palette"></i></button>
        <button onclick="document.getElementById('imgInput').click()" class="tool-btn" title="Afegir imatge" aria-label="Afegir imatge"><i class="fas fa-image"></i></button>
        
        <div class="tool-separator"></div>
        <button onclick="app.toggleBold()" id="btn-bold" class="tool-btn" title="Negreta" aria-label="Negreta" aria-pressed="false" disabled><i class="fas fa-bold"></i></button>
        <button onclick="app.toggleAlignmentMenu(event)" id="btn-align" class="tool-btn" title="Alineació del text" aria-label="Alineació del text" aria-haspopup="menu" aria-controls="alignment-menu" aria-expanded="false" disabled><i class="fas fa-align-center"></i></button>
        <button onclick="app.adjustFontSize(2)" class="tool-btn" title="Augmentar mida del text" aria-label="Augmentar mida del text"><i class="fas fa-font"></i>+</button>
        <button onclick="app.adjustFontSize(-2)" class="tool-btn" title="Reduir mida del text" aria-label="Reduir mida del text"><i class="fas fa-font"></i>-</button>
        
        <div class="tool-separator"></div>
        <button onclick="app.toggleLayoutMenu(event)" class="tool-btn" title="Canviar tipologia" aria-label="Canviar tipologia"><i class="fas fa-layer-group"></i><span class="tool-label">Tipologia</span></button>
        <button onclick="app.autoArrange()" class="tool-btn text-green-400" title="Ordenar nodes proporcionalment" aria-label="Ordenar nodes"><i class="fas fa-magic"></i><span class="tool-label">Ordenar</span></button>

        <div class="tool-separator"></div>
        
        <button onclick="app.exportPNG()" class="tool-btn text-blue-400 hover:bg-gray-700" title="Exportar PNG" aria-label="Exportar PNG"><i class="fas fa-image"></i><span class="tool-label">PNG</span></button>
        <button onclick="app.saveToJSON()" class="tool-btn" title="Desar mapa" aria-label="Desar mapa"><i class="fas fa-save"></i></button>
        <button onclick="document.getElementById('fileInput').click()" class="tool-btn" title="Obrir mapa" aria-label="Obrir mapa"><i class="fas fa-folder-open"></i></button>
    </div>

    <div id="color-menu" class="floating-menu">
        <div class="color-picker-swatch" style="background:#e5e7eb; border:1px solid #4b5563" onclick="app.setNodeColor('#e5e7eb')"></div>
        <div class="color-picker-swatch" style="background:#374151; border:1px solid #9ca3af" onclick="app.setNodeColor('#374151')"></div>
        <div class="color-picker-swatch" style="background:#ef4444" onclick="app.setNodeColor('#ef4444')"></div>
        <div class="color-picker-swatch" style="background:#eab308" onclick="app.setNodeColor('#eab308')"></div>
        <div class="color-picker-swatch" style="background:#22c55e" onclick="app.setNodeColor('#22c55e')"></div>
        <div class="color-picker-swatch" style="background:#3b82f6" onclick="app.setNodeColor('#3b82f6')"></div>
        <div class="color-picker-swatch" style="background:#a855f7" onclick="app.setNodeColor('#a855f7')"></div>
    </div>

    <div id="layout-menu" class="floating-menu">
        <div class="menu-item" onclick="app.applyLayout('mindmap')"><i class="fas fa-sitemap w-5"></i> Mapa Mental</div>
        <div class="menu-item" onclick="app.applyLayout('outline')"><i class="fas fa-list-ul w-5"></i> Esquema</div>
        <div class="menu-item" onclick="app.applyLayout('hierarchy')"><i class="fas fa-network-wired w-5"></i> Jerarquia</div>
        <div class="menu-item" onclick="app.applyLayout('flow')"><i class="fas fa-diagram-project w-5"></i> Diagrama de processos</div>
    </div>

    <div id="flow-shape-menu" class="floating-menu">
        <button type="button" class="menu-item alignment-choice" onclick="app.chooseFlowShape('terminator')"><i class="fas fa-play"></i> Inici / Fi</button>
        <button type="button" class="menu-item alignment-choice" onclick="app.chooseFlowShape('process')"><i class="fas fa-square"></i> Procés</button>
        <button type="button" class="menu-item alignment-choice" onclick="app.chooseFlowShape('decision')"><i class="fas fa-diamond"></i> Decisió</button>
        <button type="button" class="menu-item alignment-choice" onclick="app.chooseFlowShape('data')"><i class="fas fa-right-left"></i> Entrada / Sortida</button>
    </div>
    <form id="flow-label-menu" class="floating-menu" onsubmit="app.saveFlowLabel(event)">
        <label for="flow-edge-text">Text de la fletxa</label>
        <div class="flow-label-row"><input id="flow-edge-text" type="text" maxlength="80" autocomplete="off"><button type="submit" class="tool-btn" title="Desar text" aria-label="Desar text"><i class="fas fa-check"></i></button></div>
    </form>

    <div id="alignment-menu" class="floating-menu" role="menu" aria-label="Alineació del text">
        <button type="button" class="menu-item alignment-choice" role="menuitemradio" aria-checked="false" data-align="left" onclick="app.setTextAlignment('left')"><i class="fas fa-align-left"></i> Esquerra</button>
        <button type="button" class="menu-item alignment-choice" role="menuitemradio" aria-checked="false" data-align="center" onclick="app.setTextAlignment('center')"><i class="fas fa-align-center"></i> Centre</button>
        <button type="button" class="menu-item alignment-choice" role="menuitemradio" aria-checked="false" data-align="right" onclick="app.setTextAlignment('right')"><i class="fas fa-align-right"></i> Dreta</button>
        <button type="button" class="menu-item alignment-choice" role="menuitemradio" aria-checked="false" data-align="justify" onclick="app.setTextAlignment('justify')"><i class="fas fa-align-justify"></i> Justificat</button>
    </div>

    <input type="file" id="fileInput" onchange="app.loadFromJSON(this)" accept=".json">
    <input type="file" id="imgInput" onchange="app.attachImage(this)" accept="image/*">
    <div id="toast">Missatge sistema</div>

    <div id="workspace">
        <svg id="connections-layer">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                  <polygon points="0 0, 10 3.5, 0 7" fill="#f87171" />
                </marker>
                
                <marker id="arrowhead-selected" markerWidth="12" markerHeight="4" refX="11" refY="2" orient="auto">
                   <polygon points="0 0, 12 2, 0 4" fill="#3b82f6" />
                </marker>
                <marker id="flow-arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#93c5fd" /></marker>
                <marker id="flow-arrowhead-selected" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#e879f9" /></marker>
            </defs>
            <g id="connections-group"></g>
        </svg>
        <div id="nodes-layer"></div>
    </div>

    <script>
        class MindMapApp {
            constructor() {
                this.nodes = [];
                this.extraConnections = [];
                this.selectedNodeId = null;
                this.selectedConnectionId = null; 
                this.draggedNodeId = null;
                this.currentLayout = 'mindmap'; 
                
                this.isConnecting = false;
                this.isPlacingText = false;
                this.pendingFlowShape = null;
                this.currentFlowShape = 'process';
                this.connectionSourceId = null;
                
                this.panX = window.innerWidth / 2;
                this.panY = window.innerHeight / 2;
                this.zoomLevel = 1; 
                this.lastMouseX = 0;
                this.lastMouseY = 0;
                this.isDraggingWorkspace = false;
                this.isResizing = false;
                this.resizingNodeId = null;
                this.resizeStartX = 0;
                this.resizeStartWidth = 0;
                this.dragMoved = false;
                this.history = [];
                this.historyIndex = -1;
                this.maxHistory = 50;
                this._autoSaveTimer = null;
                this._autoSaveReady = false;

                this.workspace = document.getElementById('workspace');
                this.nodesLayer = document.getElementById('nodes-layer');
                this.svgGroup = document.getElementById('connections-group');
                this.colorMenu = document.getElementById('color-menu');
                this.layoutMenu = document.getElementById('layout-menu');
                this.alignmentMenu = document.getElementById('alignment-menu');

                this.bindMethods();
            }

            bindMethods() {
                this.addChild = this.addChild.bind(this);
                this.addSibling = this.addSibling.bind(this);
                this.addRootNode = this.addRootNode.bind(this);
                this.deleteNode = this.deleteNode.bind(this);
                this.toggleColorMenu = this.toggleColorMenu.bind(this);
                this.toggleLayoutMenu = this.toggleLayoutMenu.bind(this);
                this.toggleConnectMode = this.toggleConnectMode.bind(this);
                this.setNodeColor = this.setNodeColor.bind(this);
                this.saveToJSON = this.saveToJSON.bind(this);
                this.exportPNG = this.exportPNG.bind(this);
                this.exportHTML = this.exportHTML.bind(this);
                this.applyLayout = this.applyLayout.bind(this);
                this.loadFromJSON = this.loadFromJSON.bind(this);
                this.attachImage = this.attachImage.bind(this);
                this.adjustFontSize = this.adjustFontSize.bind(this);
                this.toggleBold = this.toggleBold.bind(this);
                this.zoomIn = this.zoomIn.bind(this);
                this.zoomOut = this.zoomOut.bind(this);
                this.handleMouseDown = this.handleMouseDown.bind(this);
                this.handleMouseMove = this.handleMouseMove.bind(this);
                this.handleMouseUp = this.handleMouseUp.bind(this);
                this.handleKeyDown = this.handleKeyDown.bind(this);
                this.handleNodeMouseDown = this.handleNodeMouseDown.bind(this);
                this.handleResizeMouseDown = this.handleResizeMouseDown.bind(this);
                this.selectNode = this.selectNode.bind(this);
                this.addExtraConnection = this.addExtraConnection.bind(this);
                this.render = this.render.bind(this);
                this.undo = this.undo.bind(this);
                this.redo = this.redo.bind(this);
                this.autoSave = this.autoSave.bind(this);
                this.autoArrange = this.autoArrange.bind(this);
            }

            // SECURITY: escapa caràcters HTML perillosos per evitar XSS via innerHTML
            escapeHTML(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            // SECURITY: valida que un color sigui un valor CSS segur (hex o rgb)
            sanitizeColor(color, fallback = '#374151') {
                const valid = /^#[0-9a-fA-F]{3,8}$|^rgb\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*\)$/.test(String(color));
                return valid ? color : fallback;
            }

            init() {
                let hasSaved = false;
                try { hasSaved = !!localStorage.getItem('thosmap_autosave'); } catch(e) {}
                this._autoSaveReady = !hasSaved;
                if (hasSaved) {
                    this.showRestoreDialog();
                } else {
                    this.addRootNode();
                    this.saveHistory();
                }
                window.addEventListener('keydown', this.handleKeyDown);
                window.addEventListener('mousemove', this.handleMouseMove);
                window.addEventListener('mouseup', this.handleMouseUp);
                window.addEventListener('beforeunload', () => this.flushAutoSave());
                window.addEventListener('pagehide', () => this.flushAutoSave());
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'hidden') this.flushAutoSave();
                });
                this.workspace.addEventListener('mousedown', this.handleMouseDown);
                this.workspace.addEventListener('mousedown', (e) => {
                    if ((!this.isPlacingText && !this.pendingFlowShape) || e.button !== 0) return;
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    const rect = this.workspace.getBoundingClientRect();
                    const x = (e.clientX - rect.left - this.panX) / this.zoomLevel;
                    const y = (e.clientY - rect.top - this.panY) / this.zoomLevel;
                    if (this.pendingFlowShape) {
                        const shape = this.pendingFlowShape;
                        this.pendingFlowShape = null;
                        const names = { terminator: 'Inici / Fi', process: 'Procés', decision: 'Decisió', data: 'Entrada / Sortida' };
                        const id = this.addNode(null, names[shape], false, x, y);
                        const node = this.nodes.find(n => n.id === id);
                        node.flowShape = shape;
                        node.width = shape === 'decision' ? 200 : 180;
                        this.render();
                    } else {
                        this.toggleTextMode();
                        this.addNode(null, 'Text', false, x, y, 'text');
                    }
                    this.updatePlacementButtons();
                    this.saveHistory();
                }, true);
                this.workspace.addEventListener('wheel', (e) => {
                    if (e.ctrlKey) {
                        e.preventDefault();
                        if (e.deltaY < 0) this.zoomIn(); else this.zoomOut();
                    } else {
                        e.preventDefault();
                        if (e.deltaY < 0) this.zoomIn(); else this.zoomOut();
                    }
                }, { passive: false });

                window.addEventListener('click', (e) => {
                    if (!e.target.closest('#color-menu') && !e.target.closest('[onclick*="toggleColorMenu"]')) {
                        this.colorMenu.style.display = 'none';
                    }
                    if (!e.target.closest('#layout-menu') && !e.target.closest('[onclick*="toggleLayoutMenu"]')) {
                        this.layoutMenu.style.display = 'none';
                    }
                    if (!e.target.closest('#alignment-menu') && !e.target.closest('#btn-align')) this.closeAlignmentMenu();
                    if (!e.target.closest('#flow-shape-menu') && !e.target.closest('[onclick*="toggleFlowMenu"]')) document.getElementById('flow-shape-menu').style.display = 'none';
                    if (!e.target.closest('#flow-label-menu') && !e.target.closest('[onclick*="toggleFlowMenu"]')) document.getElementById('flow-label-menu').style.display = 'none';
                });
                this.render();
            }

            zoomIn() {
                if (this.zoomLevel < 3) {
                    this.zoomLevel += 0.1;
                    this.updateTransform();
                }
            }

            zoomOut() {
                if (this.zoomLevel > 0.2) {
                    this.zoomLevel -= 0.1;
                    this.updateTransform();
                }
            }

            updateTransform() {
                const transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.zoomLevel})`;
                this.nodesLayer.style.transform = transform;
                this.svgGroup.setAttribute('transform', `translate(${this.panX} ${this.panY}) scale(${this.zoomLevel})`);
                
                this.workspace.style.backgroundPosition = `${this.panX}px ${this.panY}px`;
                this.workspace.style.backgroundSize = `${20 * this.zoomLevel}px ${20 * this.zoomLevel}px`;
            }

            // --- GESTIÓ NODES ---

            addRootNode() {
                const x = (window.innerWidth / 2 - this.panX) / this.zoomLevel;
                const y = (window.innerHeight / 2 - this.panY) / this.zoomLevel;
                this.addNode(null, "Pare", true, x, y);
                this.showToast("Pare afegit");
            }

            toggleTextMode() {
                if (!this._autoSaveReady) return;
                this.pendingFlowShape = null;
                if (this.isConnecting) this.toggleConnectMode();
                this.isPlacingText = !this.isPlacingText;
                const btn = document.getElementById('btn-text');
                btn.classList.toggle('active', this.isPlacingText);
                btn.setAttribute('aria-pressed', String(this.isPlacingText));
                this.workspace.style.cursor = this.isPlacingText ? 'text' : 'grab';
                this.updatePlacementButtons();
            }

            updatePlacementButtons() {
                const btn = document.getElementById('btn-flow-add');
                btn.classList.toggle('active', !!this.pendingFlowShape);
                btn.setAttribute('aria-pressed', String(!!this.pendingFlowShape));
                this.workspace.style.cursor = this.isPlacingText ? 'text' : (this.pendingFlowShape || this.isConnecting) ? 'crosshair' : 'grab';
            }

            startFlowBlock() {
                if (!this._autoSaveReady || this.currentLayout !== 'flow') return;
                if (this.isPlacingText) this.toggleTextMode();
                if (this.isConnecting) this.toggleConnectMode();
                this.pendingFlowShape = this.pendingFlowShape ? null : this.currentFlowShape;
                this.updatePlacementButtons();
            }

            chooseFlowShape(shape) {
                if (this.currentLayout !== 'flow' || !['terminator', 'process', 'decision', 'data'].includes(shape)) return;
                this.currentFlowShape = shape;
                const node = this.nodes.find(n => n.id === this.selectedNodeId && n.type !== 'text');
                if (node) {
                    this.saveHistory();
                    node.flowShape = shape;
                    this.saveHistory();
                    this.render();
                } else {
                    if (this.isPlacingText) this.toggleTextMode();
                    if (this.isConnecting) this.toggleConnectMode();
                    this.pendingFlowShape = shape;
                    this.updatePlacementButtons();
                }
                document.getElementById('flow-shape-menu').style.display = 'none';
            }

            toggleFlowMenu(e, id) {
                if (this.currentLayout !== 'flow') return;
                const menu = document.getElementById(id);
                const open = menu.style.display !== 'block';
                document.querySelectorAll('.floating-menu').forEach(m => m.style.display = 'none');
                this.closeAlignmentMenu();
                if (!open) return;
                if (id === 'flow-label-menu') {
                    const conn = this.extraConnections.find(c => c.id === this.selectedConnectionId);
                    if (!conn) return;
                    document.getElementById('flow-edge-text').value = conn.label || '';
                }
                const rect = e.currentTarget.getBoundingClientRect();
                menu.style.top = (rect.bottom + 5) + 'px';
                menu.style.left = Math.max(6, Math.min(rect.left, window.innerWidth - (id === 'flow-label-menu' ? 216 : 196))) + 'px';
                menu.style.display = 'block';
                if (id === 'flow-label-menu') document.getElementById('flow-edge-text').focus();
            }

            saveFlowLabel(e) {
                e.preventDefault();
                const conn = this.extraConnections.find(c => c.id === this.selectedConnectionId);
                if (!conn || this.currentLayout !== 'flow') return;
                this.saveHistory();
                conn.label = document.getElementById('flow-edge-text').value.substring(0, 80);
                delete conn.points;
                this.saveHistory();
                document.getElementById('flow-label-menu').style.display = 'none';
                this.render();
            }

            addNode(parentId, text = "Nova Idea", isRoot = false, customX = null, customY = null, type = 'node') {
                const id = 'node_' + Date.now() + Math.random().toString(36).substr(2, 5);
                let x = 0, y = 0, color = "#FFFFFF";

                if (customX !== null && customY !== null) {
                    x = customX; y = customY; color = isRoot ? "#2563eb" : "#374151"; 
                } else if (parentId) {
                    const parent = this.nodes.find(n => n.id === parentId);
                    if (parent) {
                        x = parent.x + 240; 
                        const siblings = this.nodes.filter(n => n.parentId === parentId);
                        if (siblings.length > 0) {
                            const maxY = Math.max(...siblings.map(n => n.y));
                            y = maxY + 80; 
                        } else {
                            y = parent.y;
                        }
                        if (parent.isRoot) {
                            const colors = ['#1f2937', '#374151', '#4b5563', '#6b7280', '#1f2937'];
                            color = colors[this.nodes.length % colors.length];
                        } else { color = parent.color; }
                    }
                } else { color = "#2563eb"; }

                this.saveHistory();
                const newNode = { id, parentId, text, x, y, isRoot, color, image: null, width: null, fontSize: isRoot ? 18 : 14 };
                if (type === 'text') {
                    newNode.type = 'text';
                    newNode.color = '#f9fafb';
                    newNode.fontSize = 18;
                }
                this.nodes.push(newNode);

                this.selectNode(id);
                this.render();
                setTimeout(() => {
                    const el = document.querySelector(`.node[data-id="${id}"] .node-content`);
                    if(el) { el.focus(); document.execCommand('selectAll', false, null); }
                }, 50);
                return id;
            }

            deleteNode() {
                if (this.selectedConnectionId) {
                    this.saveHistory();
                    this.extraConnections = this.extraConnections.filter(c => c.id !== this.selectedConnectionId);
                    this.selectedConnectionId = null;
                    if (this.currentLayout === 'flow') this.saveHistory();
                    this.render();
                    return;
                }

                if (!this.selectedNodeId) return;
                if (this.currentLayout === 'flow') {
                    this.saveHistory();
                    const id = this.selectedNodeId;
                    this.nodes = this.nodes.filter(n => n.id !== id);
                    this.extraConnections = this.extraConnections.filter(c => c.from !== id && c.to !== id);
                    this.selectedNodeId = null;
                    this.saveHistory();
                    this.render();
                    return;
                }
                const deletingText = this.nodes.find(n => n.id === this.selectedNodeId)?.type === 'text';
                this.saveHistory();
                const deleteRecursive = (id) => {
                    this.extraConnections = this.extraConnections.filter(c => c.from !== id && c.to !== id);
                    const children = this.nodes.filter(n => n.parentId === id);
                    children.forEach(c => deleteRecursive(c.id));
                    this.nodes = this.nodes.filter(n => n.id !== id);
                };
                deleteRecursive(this.selectedNodeId);
                this.selectedNodeId = null;
                if (deletingText) this.saveHistory();
                this.render();
            }

            addChild() {
                if (!this.selectedNodeId || this.nodes.find(n => n.id === this.selectedNodeId)?.type === 'text') return this.showToast("Selecciona un node del mapa");
                this.addNode(this.selectedNodeId);
            }
            addSibling() { 
                if (!this.selectedNodeId) return; 
                const current = this.nodes.find(n => n.id === this.selectedNodeId);
                if (current.isRoot || current.type === 'text') return;
                this.addNode(current.parentId);
            }

            // --- LAYOUTS ---

            applyLayout(type, confirmed = false) {
                if (!this._autoSaveReady || !['mindmap', 'outline', 'hierarchy', 'flow'].includes(type)) return;
                if (type === this.currentLayout) { this.layoutMenu.style.display = 'none'; return; }
                if (type === 'flow' || this.currentLayout === 'flow') {
                    this.layoutMenu.style.display = 'none';
                    if (!confirmed) { this.confirmLayoutReset(type); return; }
                    this.saveHistory();
                    this.nodes = [];
                    this.extraConnections = [];
                    this.selectedNodeId = null;
                    this.selectedConnectionId = null;
                    this.pendingFlowShape = null;
                    this.isPlacingText = false;
                    this.isConnecting = false;
                    this.connectionSourceId = null;
                    this.currentLayout = type;
                    this.resetTools();
                    this.panX = window.innerWidth / 2;
                    this.panY = window.innerHeight / 2;
                    this.zoomLevel = 1;
                    document.getElementById('btn-text').classList.remove('active');
                    document.getElementById('btn-text').setAttribute('aria-pressed', 'false');
                    document.getElementById('btn-connect').classList.remove('active');
                    this.updatePlacementButtons();
                    document.querySelectorAll('.floating-menu').forEach(m => m.style.display = 'none');
                    if (type !== 'flow') this.addRootNode();
                    this.render();
                    this.saveHistory();
                    this.flushAutoSave();
                    return;
                }
                // 1. SAVE STATE if leaving MindMap
                if (this.currentLayout === 'mindmap') {
                    this.nodes.forEach(n => {
                        if (n.type === 'text') return;
                        n.mmX = n.x;
                        n.mmY = n.y;
                    });
                }

                // 2. SWITCH
                this.currentLayout = type;
                this.workspace.classList.remove('mode-outline', 'mode-hierarchy');
                
                if (type === 'outline') {
                    this.workspace.classList.add('mode-outline');
                    this.layoutOutline(true);
                } else if (type === 'hierarchy') {
                    this.workspace.classList.add('mode-hierarchy');
                    this.layoutHierarchy(true);
                } else {
                    // Switching BACK to MindMap
                    this.nodes.forEach(n => {
                        if (n.type !== 'text' && n.mmX !== undefined && n.mmY !== undefined) {
                            n.x = n.mmX;
                            n.y = n.mmY;
                        }
                    });
                    this.layoutMindMap();
                }
                this.zoomLevel = 1;
                this.centerView();
                this.layoutMenu.style.display = 'none';
                this.render();
            }

            confirmLayoutReset(type) {
                if (document.getElementById('layout-change-dialog')) return;
                const dlg = document.createElement('div');
                dlg.id = 'layout-change-dialog';
                dlg.className = 'canvas-dialog';
                dlg.setAttribute('role', 'dialog');
                dlg.setAttribute('aria-modal', 'true');
                dlg.setAttribute('aria-labelledby', 'layout-change-title');
                dlg.setAttribute('aria-describedby', 'layout-change-warning');
                dlg.innerHTML = `<div class="canvas-dialog-panel">
                    <h2 id="layout-change-title">${type === 'flow' ? 'Entrar al Diagrama de processos?' : 'Sortir del Diagrama de processos?'}</h2>
                    <p id="layout-change-warning">S'esborraran tots els nodes, textos lliures i enllaços del llenç. No és una transformació del mapa.</p>
                    <div class="canvas-dialog-actions"><button id="layout-save">Desa una còpia</button><button id="layout-cancel">Cancel·la</button><button id="layout-confirm" class="danger">Canvia i esborra</button></div>
                </div>`;
                document.body.appendChild(dlg);
                document.getElementById('layout-save').onclick = () => this.saveToJSON();
                document.getElementById('layout-cancel').onclick = () => dlg.remove();
                document.getElementById('layout-confirm').onclick = () => { dlg.remove(); this.applyLayout(type, true); };
                document.getElementById('layout-cancel').focus();
            }

            syncLayoutUI() {
                ['outline', 'hierarchy', 'flow'].forEach(type => this.workspace.classList.toggle('mode-' + type, this.currentLayout === type));
                document.body.dataset.layout = this.currentLayout;
                document.getElementById('btn-flow-label').disabled = this.currentLayout !== 'flow' || !this.extraConnections.some(c => c.id === this.selectedConnectionId);
            }

            layoutHierarchy(resetView = false) {
                const roots = this.nodes.filter(n => n.isRoot);
                const siblingSpacing = 40; 
                const levelHeight = 100;

                const calculateTreeWidth = (nodeId) => {
                    const children = this.nodes.filter(n => n.parentId === nodeId);
                    if (children.length === 0) return 150; 
                    let width = 0;
                    children.forEach(child => { width += calculateTreeWidth(child.id) + siblingSpacing; });
                    return width - siblingSpacing;
                };

                const assignPositions = (nodeId, x, y) => {
                    const node = this.nodes.find(n => n.id === nodeId);
                    if (!node) return;
                    if (!node.isRoot) { node.x = x; node.y = y; }

                    const children = this.nodes.filter(n => n.parentId === nodeId);
                    let startX = node.x - (calculateTreeWidth(nodeId) / 2);
                    
                    children.forEach(child => {
                        const childWidth = calculateTreeWidth(child.id);
                        const childX = startX + childWidth / 2;
                        const childY = node.y + levelHeight;
                        assignPositions(child.id, childX, childY);
                        startX += childWidth + siblingSpacing;
                    });
                };

                roots.forEach(root => {
                    if (root.x === undefined) root.x = 0;
                    if (root.y === undefined) root.y = 0;
                    assignPositions(root.id, root.x, root.y);
                });

                if(resetView) this.showToast("Vista Jerarquia aplicada");
            }

            layoutMindMap() {
                this.render();
                this.showToast("Vista de Mapa Mental");
            }

            layoutOutline(resetView = false) {
                const roots = this.nodes.filter(n => n.isRoot);
                const indentX = 250; 
                
                roots.forEach(root => {
                    let currentY = 0;
                    const layoutSubtree = (nodeId, startY) => {
                        const children = this.nodes.filter(n => n.parentId === nodeId);
                        if (children.length === 0) return 60; 

                        let totalH = children.reduce((sum, c) => sum + this.getSubtreeHeight(c.id), 0);
                        let currentY = startY - (totalH / 2);

                        children.forEach(child => {
                            const parent = this.nodes.find(n => n.id === nodeId);
                            child.x = parent.x + indentX; 
                            let h = this.getSubtreeHeight(child.id);
                            child.y = currentY + (h / 2); 
                            layoutSubtree(child.id, child.y);
                            currentY += h;
                        });
                    };
                    
                    if (root.x === undefined) root.x = 0;
                    if (root.y === undefined) root.y = 0;
                    layoutSubtree(root.id, root.y);
                });

                if(resetView) this.showToast("Vista d'Esquema aplicada");
            }

            centerView() {
                if (this.nodes.length === 0) return;
                const xs = this.nodes.map(n => n.x);
                const ys = this.nodes.map(n => n.y);
                const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
                const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
                this.panX = window.innerWidth  / 2 - cx * this.zoomLevel;
                this.panY = window.innerHeight / 2 - cy * this.zoomLevel;
            }

            getSubtreeHeight(nodeId) {
                const children = this.nodes.filter(n => n.parentId === nodeId);
                if (children.length === 0) return 60;
                return children.reduce((acc, c) => acc + this.getSubtreeHeight(c.id), 0);
            }

            // Retorna nombre de fulles (per distribuir proporcionalment en mindmap)
            getSubtreeSize(nodeId) {
                const children = this.nodes.filter(n => n.parentId === nodeId);
                if (children.length === 0) return 1;
                return children.reduce((s, c) => s + this.getSubtreeSize(c.id), 0);
            }

            // Distribueix recursivament els fills d'un node cap a un costat
            arrangeSubtree(nodeId, side, levelRadius, vSpacing) {
                const node = this.nodes.find(n => n.id === nodeId);
                const children = this.nodes.filter(n => n.parentId === nodeId);
                if (!node || children.length === 0) return;
                const totalH = children.reduce((s, c) => s + this.getSubtreeSize(c.id) * vSpacing, 0);
                let curY = node.y - totalH / 2;
                children.forEach(child => {
                    const h = this.getSubtreeSize(child.id) * vSpacing;
                    child.x = node.x + side * levelRadius;
                    child.y = curY + h / 2;
                    this.arrangeSubtree(child.id, side, levelRadius, vSpacing);
                    curY += h;
                });
            }

            // Layout radial clàssic esquerra/dreta per mapa mental
            autoArrangeMindMap() {
                const levelRadius = 200;
                const vSpacing   = 70;
                this.nodes.filter(n => n.isRoot).forEach(root => {
                    const children = this.nodes.filter(n => n.parentId === root.id);
                    const half = Math.ceil(children.length / 2);
                    const right = children.slice(0, half);
                    const left  = children.slice(half);
                    [right, left].forEach((group, idx) => {
                        const side = idx === 0 ? 1 : -1;
                        const totalH = group.reduce((s, c) => s + this.getSubtreeSize(c.id) * vSpacing, 0);
                        let curY = root.y - totalH / 2;
                        group.forEach(child => {
                            const h = this.getSubtreeSize(child.id) * vSpacing;
                            child.x = root.x + side * levelRadius;
                            child.y = curY + h / 2;
                            this.arrangeSubtree(child.id, side, levelRadius, vSpacing);
                            curY += h;
                        });
                    });
                });
            }

            autoArrange() {
                if (this.currentLayout === 'flow') return this.arrangeFlow();
                if (this.currentLayout === 'outline') {
                    this.layoutOutline(false);
                } else if (this.currentLayout === 'hierarchy') {
                    this.layoutHierarchy(false);
                } else {
                    this.autoArrangeMindMap();
                }
                this.zoomLevel = 1;
                this.centerView();
                this.render();
                this.showToast("Nodes ordenats proporcionalment");
            }

            toggleConnectMode() {
                this.pendingFlowShape = null;
                if (this.isPlacingText) this.toggleTextMode();
                this.isConnecting = !this.isConnecting;
                this.connectionSourceId = null;
                const btn = document.getElementById('btn-connect');
                if (this.isConnecting) {
                    btn.classList.add('active');
                    this.showToast("Mode Enllaç: Clica l'origen i després el destí");
                    this.workspace.style.cursor = "crosshair";
                } else {
                    btn.classList.remove('active');
                    this.workspace.style.cursor = "grab";
                    document.querySelectorAll('.node').forEach(n => n.classList.remove('linking-source'));
                }
                this.updatePlacementButtons();
                document.querySelectorAll('.node-content').forEach(el => el.style.pointerEvents = this.isConnecting ? 'none' : '');
            }

            addExtraConnection(sourceId, targetId) {
                if (this.nodes.some(n => (n.id === sourceId || n.id === targetId) && n.type === 'text')) return;
                if (sourceId === targetId) return;
                const exists = this.extraConnections.find(c => c.from === sourceId && c.to === targetId);
                if (!exists) {
                    this.saveHistory();
                    const decision = this.currentLayout === 'flow' && this.nodes.find(n => n.id === sourceId)?.flowShape === 'decision';
                    const count = this.extraConnections.filter(c => c.from === sourceId).length;
                    this.extraConnections.push({ id: 'conn_' + Date.now() + Math.random().toString(36).slice(2, 7), from: sourceId, to: targetId,
                        label: decision ? (count === 0 ? 'Sí' : count === 1 ? 'No' : '') : '' });
                    if (this.currentLayout === 'flow') this.saveHistory();
                    this.renderConnections();
                    this.autoSave();
                }
            }

            selectNode(id) {
                this.selectedNodeId = id;
                this.selectedConnectionId = null; 
                this.render();
            }

            handleMouseDown(e) {
                if (e.target === this.workspace || e.target.closest('svg')) {
                    if (e.target.classList.contains('arrow-line')) return;

                    this.isDraggingWorkspace = true;
                    this.lastMouseX = e.clientX;
                    this.lastMouseY = e.clientY;
                    this.workspace.classList.add('grabbing');
                    this.selectNode(null);
                    if (this.isConnecting) this.toggleConnectMode();
                }
            }

            handleNodeMouseDown(e, id) {
                e.stopPropagation();
                if (this.isConnecting) {
                    if (this.nodes.find(n => n.id === id)?.type === 'text') return this.showToast("Selecciona un node del mapa");
                    if (!this.connectionSourceId) {
                        this.connectionSourceId = id;
                        this.showToast("Origen seleccionat. Ara clica el destí.");
                        const el = document.querySelector(`.node[data-id="${id}"]`);
                        if (el) el.classList.add('linking-source');
                    } else {
                        this.addExtraConnection(this.connectionSourceId, id);
                        this.toggleConnectMode();
                        this.showToast("Nodes connectats!");
                    }
                    return;
                }
                
                const node = this.nodes.find(n => n.id === id);
                this.draggedNodeId = id;
                this.dragMoved = false;
                this.selectNode(id);
                this.lastMouseX = e.clientX;
                this.lastMouseY = e.clientY;
            }

            handleResizeMouseDown(e, id) {
                e.stopPropagation();
                if (this.currentLayout === 'flow' || this.nodes.find(n => n.id === id)?.type === 'text') this.saveHistory();
                this.isResizing = true;
                this.resizingNodeId = id;
                this.resizeStartX = e.clientX;
                const el = document.querySelector(`.node[data-id="${id}"]`);
                this.resizeStartWidth = el.offsetWidth;
            }

            handleMouseMove(e) {
                const dx = (e.clientX - this.lastMouseX) / this.zoomLevel;
                const dy = (e.clientY - this.lastMouseY) / this.zoomLevel;

                if (this.isResizing && this.resizingNodeId) {
                    const node = this.nodes.find(n => n.id === this.resizingNodeId);
                    if (node) {
                        const el = document.querySelector(`.node[data-id="${node.id}"]`);
                        const currentWidth = (e.clientX - this.resizeStartX) / this.zoomLevel + this.resizeStartWidth;
                        node.width = Math.max(this.currentLayout === 'flow' && node.type !== 'text' ? 140 : 80, currentWidth);
                        if (el) { el.style.width = node.width + 'px'; el.style.maxWidth = 'none'; }
                        this.fitFlowSymbol(node);
                        this.renderConnections();
                    }
                } else if (this.isDraggingWorkspace) {
                    this.panX += e.clientX - this.lastMouseX; 
                    this.panY += e.clientY - this.lastMouseY;
                    this.updateTransform();
                } else if (this.draggedNodeId) {
                    const node = this.nodes.find(n => n.id === this.draggedNodeId);
                    if (node) {
                        if (!this.dragMoved) this.saveHistory();
                        this.dragMoved = true;
                        node.x += dx; node.y += dy;
                        // Si estem en MindMap, actualitzem la memòria
                        if (this.currentLayout === 'mindmap') {
                            node.mmX = node.x;
                            node.mmY = node.y;
                        }
                        this.renderNode(node);
                        this.renderConnections();
                    }
                }
                this.lastMouseX = e.clientX;
                this.lastMouseY = e.clientY;
            }
            
            handleMouseUp() {
                if (this.draggedNodeId && this.dragMoved) {
                    const node = this.nodes.find(n => n.id === this.draggedNodeId);
                    if (node && node.isRoot) {
                        if (this.currentLayout === 'outline') this.layoutOutline(false);
                        if (this.currentLayout === 'hierarchy') this.layoutHierarchy(false);
                    }
                }
                if (this.draggedNodeId && this.dragMoved && (this.currentLayout === 'flow' || this.nodes.find(n => n.id === this.draggedNodeId)?.type === 'text')) this.saveHistory();
                if (this.isResizing && (this.currentLayout === 'flow' || this.nodes.find(n => n.id === this.resizingNodeId)?.type === 'text')) this.saveHistory();
                this.isDraggingWorkspace = false;
                this.draggedNodeId = null;
                this.isResizing = false;
                this.workspace.classList.remove('grabbing');
                this.autoSave();
            }

            handleKeyDown(e) {
                if (!this._autoSaveReady) return;
                const dialog = document.getElementById('layout-change-dialog');
                if (dialog) {
                    if (e.key === 'Escape') { e.preventDefault(); dialog.remove(); }
                    if (e.key === 'Tab') {
                        const buttons = [...dialog.querySelectorAll('button')];
                        const index = buttons.indexOf(document.activeElement);
                        e.preventDefault();
                        buttons[(index + (e.shiftKey ? -1 : 1) + buttons.length) % buttons.length].focus();
                    }
                    return;
                }
                if (e.key === 'Escape') {
                    this.pendingFlowShape = null;
                    if (this.isConnecting) this.toggleConnectMode();
                    document.querySelectorAll('#flow-shape-menu, #flow-label-menu').forEach(m => m.style.display = 'none');
                    this.updatePlacementButtons();
                }
                if (e.key === 'Escape' && this.alignmentMenu.style.display === 'block') {
                    this.closeAlignmentMenu();
                    document.getElementById('btn-align').focus();
                    return;
                }
                if (e.target.closest('#alignment-menu')) {
                    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                        e.preventDefault();
                        const choices = [...this.alignmentMenu.querySelectorAll('button')];
                        const index = choices.indexOf(document.activeElement);
                        choices[(index + (e.key === 'ArrowDown' ? 1 : -1) + choices.length) % choices.length].focus();
                    }
                    return;
                }
                if (e.target.closest('#btn-align') && ['Tab', 'Enter', ' '].includes(e.key)) return;
                if (e.key === 'Escape' && this.isPlacingText) { this.toggleTextMode(); return; }
                if (e.target.closest('input, select, textarea, button, #flow-shape-menu, #flow-label-menu')) return;
                const isEditing = document.activeElement && document.activeElement.classList.contains('node-content');
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                    e.preventDefault();
                    if (e.shiftKey) this.redo(); else this.undo();
                    return;
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault(); this.redo(); return; }
                if (isEditing) return;
                switch(e.key) {
                    case 'Tab': if (this.currentLayout !== 'flow') { e.preventDefault(); this.addChild(); } break;
                    case 'Enter': if (this.currentLayout !== 'flow') { e.preventDefault(); this.addSibling(); } break;
                    case 'Delete': case 'Backspace': this.deleteNode(); break;
                }
            }

            render() {
                this.syncLayoutUI();
                this.nodesLayer.innerHTML = '';
                this.updateTransform();
                this.nodes.forEach(node => {
                    const el = this.createNodeElement(node);
                    this.nodesLayer.appendChild(el);
                    this.fitFlowSymbol(node);
                });
                this.renderConnections();
                this.updateBoldButton();
                this.updateAlignmentButton();
                this.autoSave();
            }

            fitFlowSymbol(node) {
                if (this.currentLayout !== 'flow' || node.type === 'text' || node.flowShape !== 'decision') return;
                const el = document.querySelector(`.node[data-id="${node.id}"]`);
                const wrapper = el?.querySelector('.flow-content');
                if (!wrapper) return;
                const contentHeight = [...wrapper.children].reduce((sum, child) => sum+child.offsetHeight+(child.classList.contains('node-img') ? 5 : 0), 0);
                wrapper.style.paddingTop = wrapper.style.paddingBottom = Math.max(40, contentHeight/2+12)+'px';
            }

            renderNode(node) {
                const el = document.querySelector(`.node[data-id="${node.id}"]`);
                if (el) { el.style.left = node.x + 'px'; el.style.top = node.y + 'px'; }
            }

            createNodeElement(node) {
                const el = document.createElement('div');
                const flow = this.currentLayout === 'flow' && node.type !== 'text';
                const shape = ['terminator', 'decision', 'data'].includes(node.flowShape) ? node.flowShape : 'process';
                el.className = `node ${node.id === this.selectedNodeId ? 'selected' : ''} ${node.isRoot ? 'root-node' : ''} ${node.type === 'text' ? 'free-text' : ''}`;
                if (flow) el.classList.add('flow-node', 'flow-' + shape);
                
                if (this.isConnecting && this.connectionSourceId === node.id) el.classList.add('linking-source');

                el.dataset.id = node.id;
                el.style.left = node.x + 'px';
                el.style.top = node.y + 'px';
                
                
                // CRITIC: Permetre ample en outline si està definit (pels nodes amb imatges)
                if (node.width) { 
                    el.style.width = node.width + 'px'; el.style.maxWidth = 'none'; 
                }
                
                if (node.type === 'text') {
                    el.style.setProperty('color', this.sanitizeColor(node.color, '#f9fafb'), 'important');
                } else if (flow || this.currentLayout === 'outline') {
                    el.style.backgroundColor = 'transparent';
                    el.style.color = '#e5e7eb'; 
                } else {
                    if (!node.isRoot) el.style.backgroundColor = node.color;
                    else el.style.backgroundColor = "#2563eb"; 
                    
                    el.style.color = '#f9fafb';
                }
                
                if (node.fontSize) el.style.fontSize = node.fontSize + 'px';
                el.style.fontWeight = (node.bold ?? Boolean(node.isRoot)) ? '700' : '400';

                // SECURITY: valida que node.image sigui un data URI de format raster permès
                const allowedImgTypes = ['data:image/jpeg', 'data:image/png', 'data:image/gif', 'data:image/webp'];
                const safeImage = node.image && allowedImgTypes.some(t => String(node.image).startsWith(t)) ? node.image : null;
                const imgHtml = safeImage ? `<img src="${safeImage}" class="node-img">` : '';
                const symbols = {
                    process: '<rect x="1" y="1" width="198" height="118"/>',
                    terminator: '<rect x="1" y="1" width="198" height="118" rx="59"/>',
                    decision: '<polygon points="100,1 199,60 100,119 1,60"/>',
                    data: '<polygon points="28,1 199,1 172,119 1,119"/>'
                };
                const symbol = flow ? `<svg class="flow-symbol" viewBox="0 0 200 120" preserveAspectRatio="none" aria-hidden="true" fill="${this.sanitizeColor(node.color, '#374151')}">${symbols[shape]}</svg>` : '';

                // SECURITY: node.text s'escapa amb escapeHTML per evitar XSS via innerHTML
                el.innerHTML = `
                    ${symbol}
                    <div class="flex flex-col items-center w-full ${flow ? 'flow-content' : ''}">
                        ${imgHtml}
                        <div class="node-content" contentEditable="true">${this.escapeHTML(node.text)}</div>
                    </div>
                    <div class="resize-handle" title="Arrossega per canviar la mida"></div>
                `;

                const contentDiv = el.querySelector('.node-content');
                if (this.isConnecting) contentDiv.style.pointerEvents = 'none';
                contentDiv.style.textAlign = this.getTextAlignment(node);
                
                // KEYDOWN SPECIFIC FOR NODE CONTENT (ENTER / ALT+ENTER)
                contentDiv.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        if (e.altKey) {
                            // ALT+ENTER -> New line
                            e.stopPropagation(); 
                        } else {
                            // ENTER ONLY -> Finish editing
                            e.preventDefault();
                            e.stopPropagation();
                            e.target.blur();
                        }
                    }
                });

                // SECURITY: límit de 2000 caràcters per evitar DoS via texts molt llargs
                contentDiv.addEventListener('input', () => { this.fitFlowSymbol(node); this.renderConnections(); this.autoSave(); });
                contentDiv.addEventListener('blur', (e) => {
                    const raw = e.target.innerText || '';
                    const newText = raw.length > 2000 ? raw.substring(0, 2000) : raw;
                    if (newText !== node.text) {
                        this.saveHistory();
                        node.text = newText;
                        if (node.type === 'text' || this.currentLayout === 'flow') this.saveHistory();
                        if (raw.length > 2000) e.target.innerText = node.text;
                        this.renderConnections();
                        this.autoSave();
                    }
                });
                contentDiv.addEventListener('mousedown', (e) => { if (this.selectedNodeId === node.id) e.stopPropagation(); });
                
                el.addEventListener('mousedown', (e) => this.handleNodeMouseDown(e, node.id));
                const resizeHandle = el.querySelector('.resize-handle');
                resizeHandle.addEventListener('mousedown', (e) => this.handleResizeMouseDown(e, node.id));

                return el;
            }

            renderConnections() {
                this.svgGroup.innerHTML = '';
                if (this.currentLayout === 'flow') {
                    this.extraConnections.forEach(conn => {
                        const from = this.nodes.find(n => n.id === conn.from && n.type !== 'text');
                        const to = this.nodes.find(n => n.id === conn.to && n.type !== 'text');
                        if (from && to) this.drawFlowConnection(conn, from, to);
                    });
                    return;
                }
                this.nodes.forEach(node => {
                    if (node.parentId && node.type !== 'text') {
                        const parent = this.nodes.find(n => n.id === node.parentId);
                        if (parent) this.drawTreeConnection(parent, node);
                    }
                });
                this.extraConnections.forEach(conn => {
                    const from = this.nodes.find(n => n.id === conn.from);
                    const to = this.nodes.find(n => n.id === conn.to);
                    if (from && to && from.type !== 'text' && to.type !== 'text') this.drawArrowConnection(conn.id, from, to);
                });
            }

            getFlowNodeSize(node) {
                const el = document.querySelector(`.node[data-id="${node.id}"]`);
                return { width: el?.offsetWidth || node.width || 180, height: el?.offsetHeight || (node.flowShape === 'decision' ? 130 : 72) };
            }

            flowRouteKey(from, to) {
                return JSON.stringify([from, to].map(n => [n.x, n.y, this.getFlowNodeSize(n), n.flowShape]));
            }

            flowBoundary(node, toward) {
                const { width: w, height: h } = this.getFlowNodeSize(node);
                const dx = toward.x - node.x, dy = toward.y - node.y;
                if (!dx && !dy) return { x: node.x, y: node.y };
                let vertices;
                if (node.flowShape === 'decision') vertices = [[0, -h/2], [w/2, 0], [0, h/2], [-w/2, 0]];
                else if (node.flowShape === 'data') vertices = [[-w*.36, -h/2], [w/2, -h/2], [w*.36, h/2], [-w/2, h/2]];
                else if (node.flowShape === 'terminator') {
                    vertices = [];
                    const rx = w*.295, ry = h*.49;
                    for (let i = 0; i < 40; i++) {
                        const angle = i * Math.PI / 20;
                        vertices.push([(Math.cos(angle) >= 0 ? w/2-rx : -w/2+rx) + rx*Math.cos(angle), ry*Math.sin(angle)]);
                    }
                } else vertices = [[-w/2, -h/2], [w/2, -h/2], [w/2, h/2], [-w/2, h/2]];
                // Interseca el raig amb el contorn, també per als símbols no rectangulars.
                let nearest = Infinity;
                vertices.forEach((a, i) => {
                    const b = vertices[(i+1) % vertices.length];
                    const sx = b[0]-a[0], sy = b[1]-a[1];
                    const cross = dx*sy-dy*sx;
                    if (Math.abs(cross) < 1e-8) return;
                    const t = (a[0]*sy-a[1]*sx)/cross;
                    const u = (a[0]*dy-a[1]*dx)/cross;
                    if (t >= 0 && u >= 0 && u <= 1) nearest = Math.min(nearest, t);
                });
                return Number.isFinite(nearest) ? { x: node.x+dx*nearest, y: node.y+dy*nearest } : { x: node.x, y: node.y };
            }

            flowRoute(conn, from, to) {
                if (conn.routeKey === this.flowRouteKey(from, to) && conn.points?.length >= 2) return conn.points;
                const a = this.getFlowNodeSize(from), b = this.getFlowNodeSize(to);
                let points;
                if (to.y - from.y > (a.height+b.height)/2+30) {
                    const midY = (from.y+a.height/2 + to.y-b.height/2)/2;
                    points = [{x:from.x,y:from.y}, {x:from.x,y:midY}, {x:to.x,y:midY}, {x:to.x,y:to.y}];
                } else if (Math.abs(to.x-from.x) > (a.width+b.width)/2+30 && Math.abs(to.y-from.y) < 80) {
                    const midX = (from.x+to.x)/2;
                    points = [{x:from.x,y:from.y}, {x:midX,y:from.y}, {x:midX,y:to.y}, {x:to.x,y:to.y}];
                } else {
                    const side = Math.max(from.x+a.width/2, to.x+b.width/2)+55;
                    points = [{x:from.x,y:from.y}, {x:side,y:from.y}, {x:side,y:to.y}, {x:to.x,y:to.y}];
                }
                return points.filter((p, i) => !i || p.x !== points[i-1].x || p.y !== points[i-1].y);
            }

            drawFlowConnection(conn, from, to) {
                const ns = 'http://www.w3.org/2000/svg';
                const points = this.flowRoute(conn, from, to).map(p => ({...p}));
                points[0] = this.flowBoundary(from, points[1]);
                points[points.length-1] = this.flowBoundary(to, points[points.length-2]);
                const d = points.map((p,i) => `${i ? 'L' : 'M'} ${p.x} ${p.y}`).join(' ');
                const selected = this.selectedConnectionId === conn.id;
                const path = document.createElementNS(ns, 'path');
                path.setAttribute('d', d);
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', selected ? '#e879f9' : '#93c5fd');
                path.setAttribute('stroke-width', selected ? '3' : '2');
                path.setAttribute('marker-end', `url(#${selected ? 'flow-arrowhead-selected' : 'flow-arrowhead'})`);
                path.style.pointerEvents = 'none';
