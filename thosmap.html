                const select = e => { e.stopPropagation(); this.selectedConnectionId = conn.id; this.selectedNodeId = null; this.render(); };
                const hit = document.createElementNS(ns, 'path');
                hit.setAttribute('d', d);
                hit.setAttribute('fill', 'none');
                hit.setAttribute('stroke', 'transparent');
                hit.setAttribute('stroke-width', '20');
                hit.style.pointerEvents = 'stroke';
                hit.style.cursor = 'pointer';
                hit.addEventListener('mousedown', select);
                this.svgGroup.append(hit, path);
                if (conn.label) {
                    const routed = conn.routeKey === this.flowRouteKey(from, to) && conn.labelPosition;
                    const mid = Math.max(0, Math.floor((points.length-1)/2));
                    const x = routed ? conn.labelPosition.x : (points[mid].x+points[mid+1].x)/2;
                    const y = routed ? conn.labelPosition.y : (points[mid].y+points[mid+1].y)/2;
                    const group = document.createElementNS(ns, 'g');
                    group.style.pointerEvents = 'all';
                    group.style.cursor = 'pointer';
                    const label = document.createElementNS(ns, 'text');
                    label.setAttribute('x', x);
                    label.setAttribute('y', y+4);
                    label.setAttribute('text-anchor', 'middle');
                    label.setAttribute('fill', '#f9fafb');
                    label.setAttribute('font-size', '13');
                    label.textContent = conn.label;
                    const bg = document.createElementNS(ns, 'rect');
                    bg.setAttribute('x', x-conn.label.length*3.8-6);
                    bg.setAttribute('y', y-11);
                    bg.setAttribute('width', conn.label.length*7.6+12);
                    bg.setAttribute('height', '22');
                    bg.setAttribute('rx', '3');
                    bg.setAttribute('fill', '#111827');
                    group.append(bg, label);
                    group.addEventListener('mousedown', select);
                    this.svgGroup.appendChild(group);
                }
            }

            arrangeFlow() {
                if (!window.dagre) return this.showToast('No s’ha pogut carregar l’ordenació. Torna-ho a provar amb connexió.');
                const blocks = this.nodes.filter(n => n.type !== 'text');
                if (!blocks.length) return;
                const graph = new dagre.graphlib.Graph({ multigraph: true });
                graph.setGraph({ rankdir: 'TB', nodesep: 90, ranksep: 90, marginx: 40, marginy: 40 });
                graph.setDefaultEdgeLabel(() => ({}));
                blocks.forEach(n => graph.setNode(n.id, this.getFlowNodeSize(n)));
                this.extraConnections.forEach(c => {
                    if (graph.hasNode(c.from) && graph.hasNode(c.to)) graph.setEdge(c.from, c.to, {width: c.label ? c.label.length*8+16 : 0, height: c.label ? 26 : 0}, c.id);
                });
                dagre.layout(graph);
                this.saveHistory();
                blocks.forEach(n => { const p = graph.node(n.id); n.x = p.x; n.y = p.y; });
                this.extraConnections.forEach(c => {
                    const route = graph.edge({v: c.from, w: c.to, name: c.id});
                    if (!route) return;
                    c.points = route.points;
                    const from = blocks.find(n => n.id === c.from), to = blocks.find(n => n.id === c.to);
                    c.routeKey = this.flowRouteKey(from, to);
                    c.labelPosition = Number.isFinite(route.x) ? {x:route.x, y:route.y} : null;
                });
                this.saveHistory();
                this.zoomLevel = 1;
                this.centerView();
                this.render();
                this.showToast('Diagrama ordenat');
            }

            drawTreeConnection(parent, child) {
                let startX = parent.x;
                let startY = parent.y;
                let endX = child.x;
                let endY = child.y;

                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("class", "connection-line");
                path.setAttribute("stroke", '#9ca3af'); 

                let d = "";
                
                if (this.currentLayout === 'outline') {
                    const parentEl = document.querySelector(`.node[data-id="${parent.id}"]`);
                    if (parentEl) startX += parentEl.offsetWidth + 20; 
                    else startX += 60; 

                    const safetyX = startX + 20; 
                    const stopChildX = endX - 15; 
                    
                    d = `M ${startX} ${startY} L ${safetyX} ${startY} L ${safetyX} ${endY} L ${stopChildX} ${endY}`;
                
                } else if (this.currentLayout === 'hierarchy') {
                    const pHeight = 40; 
                    const dropY = startY + (pHeight/2);
                    const enterY = endY - (pHeight/2);
                    const midY = (dropY + enterY) / 2;
                    const r = 10; 
                    if (Math.abs(enterY - dropY) < 20) {
                        d = `M ${startX} ${startY} L ${endX} ${endY}`;
                    } else {
                        const dir = endX > startX ? 1 : -1;
                        d = `M ${startX} ${startY + 20} L ${startX} ${midY - r} Q ${startX} ${midY} ${startX + (r*dir)} ${midY} L ${endX - (r*dir)} ${midY} Q ${endX} ${midY} ${endX} ${midY + r} L ${endX} ${endY - 20}`;
                    }
                } else {
                    const cp1x = startX + (endX - startX) / 2;
                    const cp1y = startY;
                    const cp2x = startX + (endX - startX) / 2;
                    const cp2y = endY;
                    d = `M ${startX} ${startY} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${endX} ${endY}`;
                }
                path.setAttribute("d", d);
                this.svgGroup.appendChild(path);
            }

            drawArrowConnection(id, from, to) {
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("class", "arrow-line");
                if (this.selectedConnectionId === id) {
                    path.setAttribute("class", "arrow-line selected");
                }
                
                const toEl = document.querySelector(`.node[data-id="${to.id}"]`);
                let targetX = to.x;
                let targetY = to.y;
                if (toEl) {
                   const w = toEl.offsetWidth;
                   const h = toEl.offsetHeight;
                   const dx = to.x - from.x;
                   const dy = to.y - from.y;
                   const angle = Math.atan2(dy, dx);
                   const absCos = Math.abs(Math.cos(angle));
                   const absSin = Math.abs(Math.sin(angle));
                   let distToEdge;
                   if ((w/2) * absSin <= (h/2) * absCos) distToEdge = (w/2) / absCos;
                   else distToEdge = (h/2) / absSin;
                   
                   targetX = to.x - Math.cos(angle) * (distToEdge + 25);
                   targetY = to.y - Math.sin(angle) * (distToEdge + 25);
                }

                const d = `M ${from.x} ${from.y} L ${targetX} ${targetY}`;
                path.setAttribute("d", d);
                
                // HIT PATH per selecció fàcil
                const hitPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
                hitPath.setAttribute("fill", "none"); 
                hitPath.setAttribute("stroke", "transparent"); 
                hitPath.setAttribute("stroke-width", "20"); 
                hitPath.style.pointerEvents = "stroke"; 
                hitPath.style.cursor = "pointer";
                hitPath.setAttribute("d", d);
                hitPath.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    this.selectedConnectionId = id;
                    this.selectedNodeId = null; 
                    this.render(); 
                });
                
                this.svgGroup.appendChild(hitPath);
                this.svgGroup.appendChild(path);
            }

            saveToJSON() {
                const editor = document.activeElement;
                const editingNode = editor?.classList.contains('node-content') ? editor.closest('.node') : null;
                const nodes = this.nodes.map(n => editingNode?.dataset.id === n.id ? {...n, text: (editor.innerText || '').substring(0, 2000)} : n);
                const data = { nodes, connections: this.extraConnections, layout: this.currentLayout };
                const blob = new Blob([JSON.stringify(data)], {type: "application/json"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = this.currentLayout === 'flow' ? 'diagrama_processos.json' : 'mapa_mental.json'; a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }
            loadFromJSON(input) {
                const file = input.files[0];
                if (!file) return;
                this.saveHistory();
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data || !Array.isArray(data.nodes) || (data.connections !== undefined && !Array.isArray(data.connections))) throw new Error('Invalid diagram');
                        const layout = ['mindmap', 'outline', 'hierarchy', 'flow'].includes(data.layout) ? data.layout : 'mindmap';
                        const safeId = (v) => String(v || '').replace(/[^a-zA-Z0-9_-]/g, '').substring(0, 64);
                        const allowedImg = ['data:image/jpeg', 'data:image/png', 'data:image/gif', 'data:image/webp'];
                        // SECURITY: cada camp del node es valida i saniteja abans d'acceptar-lo
                        const nodes = data.nodes.map(n => ({
                            id:       safeId(n.id),
                            type:     n.type === 'text' ? 'text' : 'node',
                            parentId: layout !== 'flow' && n.type !== 'text' && n.parentId ? safeId(n.parentId) : null,
                            text:     String(n.text || '').substring(0, 2000),
                            x:        Number.isFinite(Number(n.x)) ? Number(n.x) : 0,
                            y:        Number.isFinite(Number(n.y)) ? Number(n.y) : 0,
                            isRoot:   layout !== 'flow' && n.type !== 'text' && Boolean(n.isRoot),
                            flowShape: ['terminator', 'process', 'decision', 'data'].includes(n.flowShape) ? n.flowShape : 'process',
                            color:    this.sanitizeColor(n.color, n.type === 'text' ? '#f9fafb' : '#374151'),
                            image:    n.type !== 'text' && n.image && allowedImg.some(t => String(n.image).startsWith(t)) ? n.image : null,
                            width:    n.width ? Math.min(Math.max(Number(n.width) || 200, 50), 1200) : null,
                            fontSize: n.fontSize ? Math.min(Math.max(Number(n.fontSize) || 14, 10), 64) : 14,
                            bold:     typeof n.bold === 'boolean' ? n.bold : n.type !== 'text' && Boolean(n.isRoot),
                            textAlign: ['left', 'center', 'right', 'justify'].includes(n.textAlign) ? n.textAlign : null
                        }));
                        if (nodes.some(n => !n.id) || new Set(nodes.map(n => n.id)).size !== nodes.length) throw new Error('Invalid node IDs');
                        const connections = (data.connections || []).map(c => ({
                            id:   safeId(c.id),
                            from: safeId(c.from),
                            to:   safeId(c.to),
                            label: String(c.label || '').substring(0, 80)
                        })).filter(c => c.from !== c.to && nodes.some(n => n.id === c.from && n.type !== 'text') && nodes.some(n => n.id === c.to && n.type !== 'text'));
                        this.nodes = nodes;
                        this.extraConnections = connections;
                        this.currentLayout = layout;
                        this.selectedNodeId = null;
                        this.selectedConnectionId = null;
                        this.resetTools();
                        this.zoomLevel = 1;
                        this.centerView();
                        this.saveHistory();
                        this.render();
                        this.flushAutoSave();
                        input.value = '';
                        this.showToast(layout === 'flow' ? 'Diagrama carregat' : 'Mapa carregat');
                    } catch(err) {
                        this.showToast("Error: fitxer JSON invàlid");
                    }
                };
                reader.readAsText(file);
            }
            
            // MODIFICAT: Export PNG amb fons transparent
            async exportPNG() {
                if (this.nodes.length === 0) return;
                this.showToast("Generant imatge...");
                
                const oldZoom = this.zoomLevel; const oldPanX = this.panX; const oldPanY = this.panY;
                const oldW = this.workspace.style.width; const oldH = this.workspace.style.height;
                this.zoomLevel = 1;
                
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                this.nodes.forEach(n => {
                    const el = document.querySelector(`.node[data-id="${n.id}"]`);
                    const w = el ? el.offsetWidth : n.width || 200;
                    const h = el ? el.offsetHeight : 80;
                    const leftAligned = this.currentLayout === 'outline' && n.type !== 'text';
                    minX = Math.min(minX, n.x - (leftAligned ? 0 : w/2));
                    maxX = Math.max(maxX, n.x + (leftAligned ? w : w/2));
                    minY = Math.min(minY, n.y - h/2); maxY = Math.max(maxY, n.y + h/2);
                });
                if (this.currentLayout === 'flow' && this.extraConnections.length) {
                    const bounds = this.svgGroup.getBBox();
                    minX = Math.min(minX, bounds.x); minY = Math.min(minY, bounds.y);
                    maxX = Math.max(maxX, bounds.x+bounds.width); maxY = Math.max(maxY, bounds.y+bounds.height);
                }
                
                const padding = 60;
                const width = maxX - minX + padding * 2;
                const height = maxY - minY + padding * 2;
                
                this.panX = -minX + padding; this.panY = -minY + padding;
                this.updateTransform();
                
                this.workspace.style.width = `${width}px`; this.workspace.style.height = `${height}px`;
                
                try {
                    const canvas = await html2canvas(this.workspace, { 
                        backgroundColor: null, // Fons transparent
                        logging: false,
                        onclone: (clonedDoc) => {
                            const clonedWorkspace = clonedDoc.getElementById('workspace');
                            if (clonedWorkspace) {
                                // Eliminar fons CSS en la captura
                                clonedWorkspace.style.background = 'none';
                                clonedWorkspace.style.backgroundColor = 'transparent';
                            }
                        }
                    });
                    const link = document.createElement('a'); link.download = this.currentLayout === 'flow' ? 'diagrama_processos.png' : 'mapa_mental.png'; link.href = canvas.toDataURL(); link.click();
                    this.showToast("Imatge PNG descarregada");
                } catch (err) { console.error(err); this.showToast("Error generant imatge"); }
                finally {
                    this.zoomLevel = oldZoom; this.panX = oldPanX; this.panY = oldPanY;
                    this.workspace.style.width = oldW; this.workspace.style.height = oldH;
                    this.updateTransform();
                }
            }

            exportHTML() {
                const htmlContent = document.documentElement.outerHTML;
                const blob = new Blob([htmlContent], {type: "text/html"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = "mapa_publicat.html"; a.click();
                this.showToast("HTML exportat");
            }
            setNodeColor(color) {
                if (this.selectedNodeId) {
                    this.saveHistory();
                    const node = this.nodes.find(n => n.id === this.selectedNodeId);
                    node.color = this.sanitizeColor(color);
                    if (node.type === 'text') this.saveHistory();
                    this.render();
                    this.colorMenu.style.display = 'none';
                }
            }
            attachImage(input) {
                if (!this.selectedNodeId || !input.files[0]) return;
                if (this.nodes.find(n => n.id === this.selectedNodeId)?.type === 'text') {
                    input.value = '';
                    return this.showToast("Selecciona un node del mapa per afegir una imatge");
                }
                const file = input.files[0];
                const allowedTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
                if (!allowedTypes.includes(file.type)) {
                    this.showToast("Format no permès. Usa PNG, JPG, GIF o WEBP.");
                    input.value = '';
                    return;
                }
                this.saveHistory();
                const reader = new FileReader();
                reader.onload = (e) => {
                    const node = this.nodes.find(n => n.id === this.selectedNodeId);
                    node.image = e.target.result;
                    if (!node.width) node.width = 200;
                    this.render();
                };
                reader.readAsDataURL(file);
                input.value = '';
            }
            adjustFontSize(delta) {
                if (!this.selectedNodeId) return this.showToast("Selecciona un node");
                const node = this.nodes.find(n => n.id === this.selectedNodeId);
                if (node) {
                    this.saveHistory();
                    if (!node.fontSize) node.fontSize = node.isRoot ? 18 : 14;
                    node.fontSize += delta;
                    if (node.fontSize < 10) node.fontSize = 10;
                    if (node.fontSize > 64) node.fontSize = 64;
                    if (node.type === 'text') this.saveHistory();
                    this.render();
                }
            }
            toggleBold() {
                const node = this.nodes.find(n => n.id === this.selectedNodeId);
                if (!node) return;
                this.saveHistory();
                node.bold = !(node.bold ?? Boolean(node.isRoot));
                this.saveHistory();
                this.render();
            }

            updateBoldButton() {
                const btn = document.getElementById('btn-bold');
                const node = this.nodes.find(n => n.id === this.selectedNodeId);
                const bold = !!node && (node.bold ?? Boolean(node.isRoot));
                btn.disabled = !node;
                btn.classList.toggle('active', bold);
                btn.setAttribute('aria-pressed', String(bold));
            }

            getTextAlignment(node) {
                if (['left', 'center', 'right', 'justify'].includes(node.textAlign)) return node.textAlign;
                return node.type === 'text' || this.currentLayout === 'outline' ? 'left' : 'center';
            }

            toggleAlignmentMenu(e) {
                if (!this.selectedNodeId) return;
                if (this.alignmentMenu.style.display === 'block') { this.closeAlignmentMenu(); return; }
                const rect = e.currentTarget.getBoundingClientRect();
                this.alignmentMenu.style.top = (rect.bottom + 5) + 'px';
                this.alignmentMenu.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 168)) + 'px';
                this.colorMenu.style.display = 'none';
                this.layoutMenu.style.display = 'none';
                this.alignmentMenu.style.display = 'block';
                document.getElementById('btn-align').setAttribute('aria-expanded', 'true');
                this.alignmentMenu.querySelector('[aria-checked="true"]').focus();
            }

            closeAlignmentMenu() {
                this.alignmentMenu.style.display = 'none';
                document.getElementById('btn-align').setAttribute('aria-expanded', 'false');
            }

            setTextAlignment(alignment) {
                const node = this.nodes.find(n => n.id === this.selectedNodeId);
                if (!node || !['left', 'center', 'right', 'justify'].includes(alignment)) return;
                this.saveHistory();
                node.textAlign = alignment;
                this.saveHistory();
                this.closeAlignmentMenu();
                this.render();
                document.getElementById('btn-align').focus();
            }

            updateAlignmentButton() {
                const btn = document.getElementById('btn-align');
                const node = this.nodes.find(n => n.id === this.selectedNodeId);
                const alignment = node ? this.getTextAlignment(node) : 'center';
                btn.disabled = !node;
                btn.querySelector('i').className = 'fas fa-align-' + alignment;
                this.alignmentMenu.querySelectorAll('[data-align]').forEach(choice => {
                    choice.setAttribute('aria-checked', String(!!node && choice.dataset.align === alignment));
                });
                if (!node) this.closeAlignmentMenu();
            }

            showRestoreDialog() {
                const dlg = document.createElement('div');
                dlg.id = 'restore-dialog';
                dlg.innerHTML = `
                    <div class="dialog-box">
                        <div class="dialog-icon">💾</div>
                        <h2>Recuperar treball anterior?</h2>
                        <p>Hi ha una sessió desada automàticament. Vols continuar des d'on ho vas deixar?</p>
                        <div class="dialog-btns">
                            <button class="btn-yes" id="restore-yes">Sí, recupera</button>
                            <button class="btn-no" id="restore-no">No, comença de nou</button>
                        </div>
                    </div>`;
                document.body.appendChild(dlg);
                document.getElementById('restore-yes').onclick = () => {
                    const ok = this.loadAutoSave();
                    if (!ok) {
                        this.showToast("No s'ha pogut recuperar la còpia desada. No s'ha esborrat.");
                        return;
                    }
                    this._autoSaveReady = true;
                    dlg.remove();
                    this.render();
                    this.showToast("✓ Treball recuperat");
                    this.saveHistory();
                };
                document.getElementById('restore-no').onclick = () => {
                    dlg.remove();
                    localStorage.removeItem('thosmap_autosave');
                    this._autoSaveReady = true;
                    this.addRootNode();
                    this.saveHistory();
                };
            }

            saveHistory() {
                const snapshot = {
                    nodes: JSON.parse(JSON.stringify(this.nodes)),
                    connections: JSON.parse(JSON.stringify(this.extraConnections)),
                    layout: this.currentLayout
                };
                if (JSON.stringify(snapshot) === JSON.stringify(this.history[this.historyIndex])) return;
                this.history = this.history.slice(0, this.historyIndex + 1);
                this.history.push(snapshot);
                if (this.history.length > this.maxHistory) this.history.shift();
                else this.historyIndex++;
                this.updateUndoRedoButtons();
            }

            undo() {
                this.saveHistory();
                if (this.historyIndex <= 0) return this.showToast("Res a desfer");
                this.historyIndex--;
                const state = this.history[this.historyIndex];
                this.nodes = JSON.parse(JSON.stringify(state.nodes));
                this.extraConnections = JSON.parse(JSON.stringify(state.connections));
                this.currentLayout = state.layout || 'mindmap';
                this.selectedNodeId = null;
                this.selectedConnectionId = null;
                this.resetTools();
                this.render();
                this.updateUndoRedoButtons();
                this.showToast("Desfet");
            }

            redo() {
                if (this.historyIndex >= this.history.length - 1) return this.showToast("Res a refer");
                this.historyIndex++;
                const state = this.history[this.historyIndex];
                this.nodes = JSON.parse(JSON.stringify(state.nodes));
                this.extraConnections = JSON.parse(JSON.stringify(state.connections));
                this.currentLayout = state.layout || 'mindmap';
                this.selectedNodeId = null;
                this.selectedConnectionId = null;
                this.resetTools();
                this.render();
                this.updateUndoRedoButtons();
                this.showToast("Refet");
            }

            updateUndoRedoButtons() {
                const u = document.getElementById('btn-undo');
                const r = document.getElementById('btn-redo');
                if (u) u.disabled = this.historyIndex <= 0;
                if (r) r.disabled = this.historyIndex >= this.history.length - 1;
            }

            resetTools() {
                this.pendingFlowShape = null;
                this.isPlacingText = false;
                this.isConnecting = false;
                this.connectionSourceId = null;
                this.draggedNodeId = null;
                this.isResizing = false;
                document.getElementById('btn-text').classList.remove('active');
                document.getElementById('btn-text').setAttribute('aria-pressed', 'false');
                document.getElementById('btn-connect').classList.remove('active');
                document.querySelectorAll('.floating-menu').forEach(m => m.style.display = 'none');
                this.updatePlacementButtons();
            }

            autoSave() {
                clearTimeout(this._autoSaveTimer);
                if (!this._autoSaveReady) return;
                this._autoSaveTimer = setTimeout(() => this.flushAutoSave(), 1500);
            }

            flushAutoSave() {
                clearTimeout(this._autoSaveTimer);
                this._autoSaveTimer = null;
                // La còpia anterior es conserva fins que es resol el diàleg de recuperació.
                if (!this._autoSaveReady) return;
                try {
                    const editor = document.activeElement;
                    const editingNode = editor && editor.classList.contains('node-content')
                        ? editor.closest('.node') : null;
                    // Inclou el text que encara s'està editant, abans de perdre el focus.
                    const nodes = editingNode ? this.nodes.map(node => node.id === editingNode.dataset.id
                        ? { ...node, text: (editor.innerText || '').substring(0, 2000) } : node) : this.nodes;
                    localStorage.setItem('thosmap_autosave', JSON.stringify({
                        nodes,
                        connections: this.extraConnections,
                        layout: this.currentLayout,
                        panX: this.panX, panY: this.panY, zoom: this.zoomLevel
                    }));
                } catch(e) {}
            }

            loadAutoSave() {
                try {
                    const raw = localStorage.getItem('thosmap_autosave');
                    if (!raw) return false;
                    const state = JSON.parse(raw);
                    if (!Array.isArray(state.nodes) || (state.nodes.length === 0 && state.layout !== 'flow')) return false;
                    this.nodes = state.nodes;
                    this.extraConnections = Array.isArray(state.connections) ? state.connections : [];
                    this.currentLayout = ['mindmap', 'outline', 'hierarchy', 'flow'].includes(state.layout) ? state.layout : 'mindmap';
                    this.panX = state.panX ?? window.innerWidth / 2;
                    this.panY = state.panY ?? window.innerHeight / 2;
                    this.zoomLevel = state.zoom ?? 1;
                    this.syncLayoutUI();
                    return true;
                } catch(e) { return false; }
            }

            toggleColorMenu(e) { const rect = e.target.getBoundingClientRect(); this.colorMenu.style.top = (rect.bottom + 5) + 'px'; this.colorMenu.style.left = rect.left + 'px'; this.colorMenu.style.display = 'block'; this.layoutMenu.style.display = 'none'; }
            toggleLayoutMenu(e) { const rect = e.target.closest('button').getBoundingClientRect(); this.layoutMenu.style.top = (rect.bottom + 5) + 'px'; this.layoutMenu.style.left = rect.left + 'px'; this.layoutMenu.style.display = 'block'; this.colorMenu.style.display = 'none'; }
            showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.opacity = '1'; setTimeout(() => t.style.opacity = '0', 3000); }
        }

        window.onload = () => { 
            window.app = new MindMapApp(); 
            window.app.init(); 
        };
    </script>
</body>
