<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THOSMATERIAL · Assaigs mecànics</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#e6f3f7;background:#0d2635}*{box-sizing:border-box}body{margin:0}header{background:#102c3e;padding:8px 24px;display:grid;grid-template-columns:minmax(220px,1fr) auto minmax(220px,1fr);align-items:center;gap:10px;border-bottom:2px solid #006d81}h1{margin:0;font-size:22px}h1 span{color:#66d4da}nav{display:flex;justify-self:center;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap}nav a{display:inline-flex;align-items:center;justify-content:center;gap:7px;color:#d6e7eb;text-decoration:none;background:#244756;border:1px solid #416270;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:650;white-space:nowrap}nav a.active{background:#007c97;color:white}main{display:grid;grid-template-columns:240px minmax(0,1fr);gap:12px;padding:12px}aside,.panel,.metric{background:#163547;border:1px solid #35596b;border-radius:10px;padding:18px}aside label{display:block;font-size:13px;font-weight:650;margin:18px 0 7px}select,input{width:100%}select{background:#102b3d;color:white;border:1px solid #527386;border-radius:7px;padding:10px}input{accent-color:#25b5d0}output{color:#5ad4e4;float:right}button{background:#007c97;color:white;border:0;border-radius:7px;padding:10px;cursor:pointer}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:22px}.actions button{flex:1}.workspace{min-width:0}.twocol{display:grid;grid-template-columns:minmax(300px,1fr) minmax(380px,1.3fr);gap:12px}.panel h2{font-size:18px;margin:0 0 10px}.panel p,.note{font-size:13px;color:#b4cfda;line-height:1.55}.scene{height:405px;border-radius:9px;background:radial-gradient(circle,#23485b,#102b3b)}.graph{width:100%;height:405px;background:#f6fafc;border-radius:9px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.metric{padding:14px}.metric small{display:block;color:#b4cfda}.metric strong{display:block;color:#50d0e4;font-size:22px;margin-top:6px}.panel{margin-bottom:12px}svg.graph{width:100%;height:100%}.tag{color:#67d5e6;font-size:12px;font-weight:700;letter-spacing:1px}@media(max-width:1320px){header{grid-template-columns:1fr}header h1,header nav{justify-self:center}header .header-balance{display:none}}@media(max-width:1100px){.twocol{grid-template-columns:1fr}}@media(max-width:750px){main{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.scene,.graph{height:310px}}
.app-header{background:#102c3e;color:#f3fbfc;display:grid;grid-template-columns:minmax(220px,1fr) auto minmax(220px,1fr);align-items:center;gap:10px;padding:8px 24px;border-bottom:2px solid #006d81}.app-header .brand{justify-self:start;display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}.app-header .brand img{width:42px;height:42px}.app-header h1{font-size:22px;color:#f2fbfc}.app-header h1 span{color:#66d4da}.test-nav{justify-self:center;display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap}.test-nav a.test-link{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#244756;color:#d6e7eb;border:1px solid #416270;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:650;white-space:nowrap;text-decoration:none}.test-nav a.test-link svg{width:19px;height:19px;flex-shrink:0}.test-nav a.test-active{background:#007f93;border-color:#36b5c4;color:#fff}.header-balance{min-width:0}@media(max-width:1320px){.app-header{grid-template-columns:1fr}.app-header .brand,.test-nav{justify-self:center}.header-balance{display:none}}@media(max-width:750px){.test-nav{gap:6px}.test-nav a.test-link{padding:9px 10px;font-size:12px}.app-header{padding:8px 12px}} .scene{position:relative;overflow:hidden}.scene canvas{display:block;width:100%;height:100%;touch-action:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script></head><body><header class="app-header"><a class="brand" href="https://tecno-apps.cat/" target="_top" aria-label="THOSMATERIAL · Tecno-Apps"><img src="logo.svg" alt=""><h1>THOS<span>MATERIAL</span></h1></a><nav class="test-nav" aria-label="Tipus d’assaig"><a class="test-link" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4M5 10h14v4H5z"/></svg><span>Tracció</span></a><a class="test-link" href="?test=compressio" data-test="compressio"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M8 7l4 4 4-4M8 17l4-4 4 4M5 10h14v4H5z"/></svg><span>Compressió</span></a><a class="test-link" href="?test=flexio" data-test="flexio"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h18M5 15V9m14 6V9M6 11q6-7 12 0M12 3v6m-3-3 3 3 3-3"/></svg><span>Flexió</span></a><a class="test-link" href="?test=torsio" data-test="torsio"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6a8 8 0 0 1 14 4M19 18a8 8 0 0 1-14-4M19 5v5h-5M5 19v-5h5M9 12h6"/></svg><span>Torsió</span></a><a class="test-link" href="?test=duresa" data-test="duresa"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6m-4-3 4 4 4-4M5 15h14v6H5zM9 12l3-3 3 3-3 3z"/></svg><span>Duresa</span></a><a class="test-link" href="?test=impacte" data-test="impacte"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v8m0 0 6 6M6 11l-3-3m3 3 3-3M12 17l4-3 4 4-4 3z"/> </svg><span>Impacte</span></a></nav><div class="header-balance" aria-hidden="true"></div></header><main><aside><div class="tag">PROTOTIP DIDÀCTIC · V0.1</div><label for="material">Material</label><select id="material"><option value="steel">Acer baix en carboni</option><option value="aluminum">Alumini</option><option value="copper">Coure</option><option value="pvc">PVC</option></select><label for="load">Intensitat de l'assaig <output id="loadOut">0 %</output></label><input type="range" id="load" min="0" max="1000" value="0"><label for="size">Dimensió característica <output id="sizeOut">20 mm</output></label><input type="range" id="size" min="10" max="50" value="20"><div class="actions"><button id="play">▶ Inicia</button><button id="reset">↺ Reinicia</button></div><p class="note">Primera aproximació visual i interactiva. Models simplificats, no substitueixen un assaig normalitzat ni dades experimentals.</p></aside><section class="workspace"><div class="twocol"><div class="panel"><h2 id="sceneTitle"></h2><div class="scene" id="scene3d" role="img" aria-label="Simulació tridimensional interactiva de l’assaig"></div></div><div class="panel"><h2 id="chartTitle"></h2><div class="graph"><svg id="chart" viewBox="0 0 680 380" role="img" aria-label="Gràfica de l'assaig"></svg></div></div></div><div class="metrics"><div class="metric"><small id="metric1Name">Magnitud</small><strong id="metric1"></strong></div><div class="metric"><small id="metric2Name">Magnitud</small><strong id="metric2"></strong></div><div class="metric"><small>Progrés</small><strong id="metric3"></strong></div><div class="metric"><small>Fase</small><strong id="metric4"></strong></div></div><div class="panel"><h2>Interpretació de l'assaig</h2><p id="description"></p><p class="note" id="formula"></p></div></section></main><script>
const $=id=>document.getElementById(id);
const models={steel:{name:'Acer',E:207000,yield:295,hard:170},aluminum:{name:'Alumini',E:69000,yield:85,hard:65},copper:{name:'Coure',E:110000,yield:69,hard:75},pvc:{name:'PVC',E:3300,yield:45,hard:12}};
const tests={
compressio:{name:'Compressió',chart:'Tensió de compressió – deformació',x:'Deformació ε (%)',y:'Tensió σ (MPa)',m1:'Força compressiva',m2:'Escurçament',formula:'Compressió uniaxial: ε = ΔL/L₀, σ = F/A₀. Tram elàstic σ = Eε; després del límit elàstic, enduriment lineal didàctic (pendent 0,035·E). La deformació 3D s’amplifica ×20 respecte de la real.',description:'Compressió axial entre dues plaques. La proveta s’escurça i s’eixampla lateralment; la deformació 3D està amplificada ×20. La tensió és nominal (secció inicial), sense vinclament ni fricció.'},
flexio:{name:'Flexió',chart:'Força – fletxa',x:'Fletxa central (mm)',y:'Força (N)',m1:'Força central',m2:'Fletxa',formula:'Biga biarticulada amb càrrega central: δ = FL³/(48EI). Secció rectangular: I = bh³/12. Model de petites deformacions.',description:'Assaig de flexió en tres punts. La fibra superior treballa a compressió i la inferior a tracció.'},
torsio:{name:'Torsió',chart:'Parell – angle de gir',x:'Angle de gir (°)',y:'Parell (N·m)',m1:'Parell',m2:'Angle',formula:'Eix circular: θ = TL/(GJ), J = πd⁴/32; G ≈ E/[2(1+ν)] amb ν aproximat. Model elàstic ideal.',description:'Els extrems de la proveta reben un parell torsor. Les seccions giren al voltant de l’eix longitudinal.'},
duresa:{name:'Duresa',chart:'Força – profunditat de penetració',x:'Profunditat (mm)',y:'Força (N)',m1:'Força aplicada',m2:'Penetració',formula:'Model qualitatiu de penetració. La duresa normalitzada (Brinell, Vickers, Rockwell) requereix geometria, càrrega i procediment específics.',description:'Un penetrador pressiona la superfície i produeix una empremta. La gràfica és esquemàtica: no calcula un valor HB, HV ni HRC.'},
impacte:{name:'Impacte',chart:'Energia absorbida – recorregut',x:'Progrés de l’impacte (%)',y:'Energia absorbida (J)',m1:'Energia absorbida',m2:'Angle del pèndol',formula:'Pèndol ideal: E absorbida = mg(h inicial − h final). Energia i trencament esquemàtics; no equival a una prova Charpy normalitzada.',description:'Un pèndol colpeja una proveta recolzada. La diferència d’altura abans i després del xoc indica l’energia absorbida.'}};
let id=new URLSearchParams(location.search).get('test');if(!tests[id])id='compressio';let playing=false,raf=0,last=0,progress=0;
document.querySelectorAll('[data-test]').forEach(a=>{if(a.dataset.test===id){a.classList.add('test-active');a.setAttribute('aria-current','page')}});
const compressionStress=(m,eps)=>{const ey=m.yield/m.E;return eps<=ey?m.E*eps:m.yield+m.E*.035*(eps-ey)};
const n=(x,d=1)=>Number(x).toFixed(d),line=(x1,y1,x2,y2,color='#62d5e7',w=4)=>'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-width="'+w+'" stroke-linecap="round"/>';
const rect=(x,y,w,h,fill='#39a9bd',r=4)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'" fill="'+fill+'"/>';
function render(){const p=progress,m=models[$('material').value],d=+$('size').value,t=tests[id];$('load').value=Math.round(p*1000);$('loadOut').textContent=Math.round(p*100)+' %';$('sizeOut').textContent=d+' mm';$('sceneTitle').textContent=t.name+' · proveta';$('chartTitle').textContent=t.chart;$('description').textContent=t.description;$('formula').textContent=t.formula;
let scene='',x=0,y=0,xmax=1,ymax=1,unit1='',unit2='',phase=p<.25?'Inici':p<.65?'Deformació':'Fase final';
if(id==='compressio'){const L=120*(1-.24*p),w=55*(1+.22*p),eps=.012*p,s=compressionStress(m,eps),F=s*Math.PI*d*d/4/1000;scene=rect(135,270,230,16,'#7e9ca9')+rect(135,270-L-17,230,16,'#7e9ca9')+rect(250-w/2,270-L,w,L,'#39a9bd')+line(250,65,250,235-L,'#f4ad54',6);x=eps*100;y=s;xmax=1.2;ymax=Math.max(50,compressionStress(m,.012)*1.18);unit1=n(F)+' kN';unit2=n(eps*120,2)+' mm';phase=eps<=m.yield/m.E?'Zona elàstica':'Zona plàstica';}
if(id==='flexio'){const L=300,h=d*.9,delta=65*p,load=m.E*d*d*d*delta/(4*300**3);scene=rect(90,255,20,20,'#7e9ca9')+rect(390,255,20,20,'#7e9ca9')+'<path d="M100 250 Q250 '+(250+delta*2)+' 400 250" fill="none" stroke="#39a9bd" stroke-width="'+Math.max(12,h)+'" stroke-linecap="round"/>'+line(250,90,250,205+delta,'#f4ad54',6);x=delta;y=load;xmax=70;ymax=Math.max(100,load/Math.max(.01,p)*1.2);unit1=n(load)+' N';unit2=n(delta)+' mm';}
if(id==='torsio'){const angle=75*p,G=m.E/2.6,L=200,J=Math.PI*d**4/32,T=G*J*(angle*Math.PI/180)/L/1000;scene=rect(90,145,35,100,'#7e9ca9')+rect(125,166,250,58,'#39a9bd')+rect(375,145,35,100,'#7e9ca9')+'<ellipse cx="375" cy="195" rx="20" ry="29" fill="#5ac5d5"/><path d="M370 145 A55 55 0 '+(p>.5?1:0)+' 1 '+(370+45*Math.sin(p*1.5))+' '+(145+45*(1-Math.cos(p*1.5)))+'" fill="none" stroke="#f4ad54" stroke-width="6"/>';x=angle;y=T;xmax=80;ymax=Math.max(1,T/Math.max(.01,p)*1.2);unit1=n(T,2)+' N·m';unit2=n(angle)+'°';}
if(id==='duresa'){const depth=3*p,force=(m.hard*15)*p*p;scene=rect(100,245,300,90,'#39a9bd')+'<path d="M225 '+(75+depth*38)+' L275 '+(75+depth*38)+' L250 '+(155+depth*38)+' Z" fill="#b5c6ce"/>'+line(250,40,250,70+depth*38,'#f4ad54',6);x=depth;y=force;xmax=3.2;ymax=m.hard*17;unit1=n(force)+' N';unit2=n(depth,2)+' mm';phase=p<.2?'Contacte':p<.8?'Penetració':'Empremta';}
if(id==='impacte'){const theta=(1-p)*(-65)+p*48,rad=theta*Math.PI/180,cx=250+180*Math.sin(rad),cy=65+180*Math.cos(rad),energy=80*(1-Math.cos(Math.PI*Math.min(p,1)))/2;scene=line(250,55,cx,cy,'#b5c6ce',7)+'<circle cx="'+cx+'" cy="'+cy+'" r="27" fill="#f4ad54"/>'+rect(185,280,130,16,'#7e9ca9')+rect(230,252,40,28,'#39a9bd');x=p*100;y=energy;xmax=100;ymax=90;unit1=n(energy)+' J';unit2=n(theta)+'°';phase=p<.4?'Caiguda':p<.65?'Impacte':'Ascens';}
if(window.updateThosOther3D)window.updateThosOther3D({test:id,progress:p,size:d,material:$('material').value});
const sx=v=>62+580*v/xmax,sy=v=>310-250*v/ymax;let path='';for(let i=0;i<=100;i++){const q=i/100;let yy;if(id==='compressio')yy=compressionStress(m,.012*q);else if(id==='flexio')yy=m.E*d**3*(65*q)/(4*300**3);else if(id==='torsio')yy=(m.E/2.6)*(Math.PI*d**4/32)*(75*q*Math.PI/180)/200/1000;else if(id==='duresa')yy=m.hard*15*q*q;else yy=80*(1-Math.cos(Math.PI*q))/2;let xx=id==='compressio'?1.2*q:id==='flexio'?65*q:id==='torsio'?75*q:id==='duresa'?3*q:100*q;path+=(i?'L':'M')+sx(xx).toFixed(1)+' '+sy(yy).toFixed(1)+' ';}
let grid='';for(let i=0;i<=5;i++){grid+=line(62+580*i/5,60,62+580*i/5,310,'#dce8ec',1)+line(62,310-250*i/5,642,310-250*i/5,'#dce8ec',1);}
$('chart').innerHTML=grid+line(62,60,62,310,'#637f8b',2)+line(62,310,642,310,'#637f8b',2)+'<path d="'+path+'" stroke="#007f93" stroke-width="4" fill="none"/><circle cx="'+sx(x)+'" cy="'+sy(y)+'" r="7" fill="#ee8b35" stroke="white" stroke-width="2"/><text x="350" y="351" text-anchor="middle" fill="#183644" font-size="14">'+t.x+'</text><text transform="translate(18 190) rotate(-90)" text-anchor="middle" fill="#183644" font-size="14">'+t.y+'</text><text x="70" y="42" font-size="12" fill="#58727f">Corba didàctica aproximada</text>';
$('metric1Name').textContent=t.m1;$('metric2Name').textContent=t.m2;$('metric1').textContent=unit1;$('metric2').textContent=unit2;$('metric3').textContent=Math.round(p*100)+' %';$('metric4').textContent=phase;}
function stop(){playing=false;cancelAnimationFrame(raf);$('play').textContent='▶ Inicia';}
$('play').onclick=()=>{if(playing){stop();return;}if(progress>=1)progress=0;playing=true;last=0;$('play').textContent='Ⅱ Pausa';function tick(now){if(!playing)return;if(last)progress=Math.min(1,progress+Math.min((now-last)/1000,.05)/18);last=now;render();if(progress>=1)stop();else raf=requestAnimationFrame(tick);}raf=requestAnimationFrame(tick)};
$('reset').onclick=()=>{stop();progress=0;render()};$('load').oninput=()=>{stop();progress=+$('load').value/1000;render()};$('size').oninput=()=>{stop();render()};$('material').onchange=()=>{stop();progress=0;render()};render();
</script><script type="module" src="other-tests3d.js?v=4e11b709"></script></body></html>
