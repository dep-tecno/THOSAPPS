<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THOSPAD · PADS d’aula</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script defer src="store.js"></script>
  <script defer src="pad-files.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="https://tecno-apps.cat/" aria-label="THOSPAD · Ves a Tecno-apps">
      <span class="pad-logo" aria-hidden="true"><i></i><i></i><i></i></span>
      <strong>THOS<span>PAD</span></strong>
    </a>
    <div class="toolbar" role="group" aria-label="Accions del PAD">
      <div class="tool-group">
        <label class="tool-select"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M9 9v11"/></svg> PAD <select id="boards"></select></label>
        <label class="tool-select" hidden><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> Format <select id="views"></select></label>
        <label class="tool-select" id="timeline-control" hidden><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20V4m0 16h16M4 4 2 6m2-2 2 2m14 14-2-2m2 2-2 2"/></svg> Orientació
          <select id="timeline-direction">
            <option value="vertical">Vertical</option>
            <option value="horizontal">Horitzontal</option>
          </select>
        </label>
        <button id="new-board"><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg> Nou PAD</button>
      </div>
      <div class="tool-group file-tools">
        <button id="save-pad" disabled><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></svg> Desa</button>
        <button id="open-pad" disabled><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 19V6a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v1M3 19l3-9h16l-3 9H3Z"/></svg> Obre</button>
        <input id="pad-file" type="file" accept=".json,application/json" hidden>
        <button id="photo-pad" aria-label="Exporta una foto" title="Exporta una foto" disabled><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 6l2-3h4l2 3h4a1 1 0 0 1 1 1v12H3V7a1 1 0 0 1 1-1Z"/><circle cx="12" cy="12" r="3"/></svg> Foto</button>
        <button id="delete-pad" class="danger" aria-label="Elimina el PAD" title="Elimina el PAD" hidden><svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></svg> Elimina</button>
      </div>
    </div>
  </header>
  <main>
    <p id="status" role="status"></p>
    <p id="no-pads" class="empty" hidden>Encara no tens cap PAD. Prem «+ Nou PAD» per crear-ne un.</p>
    <div id="board-surface" class="board-surface" data-theme="forest">
    <section class="intro" aria-labelledby="title">
      <div><h1><button id="edit-pad" type="button" title="Edita el PAD"><span id="title"></span><span class="edit-pad-icon" aria-hidden="true">✎</span></button></h1><p id="description"></p></div>
      <button class="primary" id="new-post">+ Publica</button>
    </section>
    <section id="content" aria-label="Publicacions"></section>
    </div>
  </main>
  <dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description">
    <form id="delete-form">
      <h2 id="delete-title">Elimina el PAD</h2>
      <p id="delete-description"></p>
      <p id="delete-status" role="alert"></p>
      <div class="actions">
        <button type="button" id="cancel-delete" autofocus>Cancel·la</button>
        <button class="danger" id="confirm-delete">Elimina el PAD</button>
      </div>
    </form>
  </dialog>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="edit-form">
      <div class="editor-heading">
        <h2 id="editor-title"></h2>
        <div class="actions"><button type="button" id="cancel">Cancel·la</button><button id="editor-save" class="primary">Desa</button></div>
      </div>
      <label>Títol <input name="title" required maxlength="100"></label>
      <label id="body-label"><span></span><textarea name="body" maxlength="1500" rows="4"></textarea></label>
      <fieldset id="board-types">
        <legend>Tipologia inicial</legend>
        <div class="type-options"></div>
      </fieldset>
      <fieldset id="backgrounds">
        <legend>Fons del PAD</legend>
        <p class="background-category">Estampats</p>
        <div class="background-options">
          <label><input type="radio" name="theme" value="mosaic"><span data-theme="mosaic">Mosaic</span></label>
          <label><input type="radio" name="theme" value="confetti"><span data-theme="confetti">Confeti</span></label>
          <label><input type="radio" name="theme" value="tiles"><span data-theme="tiles">Rajoles</span></label>
        </div>
        <p class="background-category">Textures i paisatges</p>
        <div class="background-options">
          <label><input type="radio" name="theme" value="wood"><span data-theme="wood">Fusta</span></label>
          <label><input type="radio" name="theme" value="paper"><span data-theme="paper">Paper</span></label>
          <label><input type="radio" name="theme" value="shore"><span data-theme="shore">Platja</span></label>
        </div>
        <p class="background-category">Degradats</p>
        <div class="background-options">
          <label><input type="radio" name="theme" value="forest" checked><span data-theme="forest">Bosc</span></label>
          <label><input type="radio" name="theme" value="ocean"><span data-theme="ocean">Oceà</span></label>
          <label><input type="radio" name="theme" value="lavender"><span data-theme="lavender">Lavanda</span></label>
          <label><input type="radio" name="theme" value="dune"><span data-theme="dune">Duna</span></label>
          <label><input type="radio" name="theme" value="coral"><span data-theme="coral">Corall</span></label>
        </div>
      </fieldset>
      <label data-field="group">Grup (fila o columna) <input name="group" maxlength="60" placeholder="General"></label>
      <label data-field="link">Enllaç web <input name="link" type="url" placeholder="https://…" maxlength="2048"></label>
      <div data-field="image" class="image-editor">
        <label>Imatge <input id="post-image" type="file" accept="image/jpeg,image/png,image/webp"></label>
        <img id="image-preview" class="post-image" alt="Imatge de la publicació" hidden>
        <button id="remove-image" type="button" hidden>Treu la imatge</button>
      </div>
      <fieldset data-field="date">
        <legend>Data</legend>
        <label>Precisió
          <select name="datePrecision" id="date-precision">
            <option value="">Sense data</option>
            <option value="year">Només any</option>
            <option value="month">Mes i any</option>
            <option value="day">Data completa</option>
          </select>
        </label>
        <label id="date-year-field" hidden>Any <input name="dateYear" type="number" min="1" max="9999" step="1" disabled></label>
        <label id="date-month-field" hidden>Mes <select name="dateMonth" disabled><option value="">Tria un mes</option></select></label>
        <label id="date-day-field" hidden>Dia, mes i any <input name="date" type="date" min="0001-01-01" max="9999-12-31" disabled></label>
      </fieldset>
      <label data-field="place">Lloc <input name="place" maxlength="100"></label>
      <div class="coordinates" data-field="coordinates">
        <label>Latitud <input name="lat" type="number" min="-90" max="90" step="any"></label>
        <label>Longitud <input name="lon" type="number" min="-180" max="180" step="any"></label>
      </div>
      <p id="editor-status" role="alert"></p>
    </form>
  </dialog>
</body>
</html>
