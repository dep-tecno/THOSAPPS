name: THOSsCAN · Compilar navegador
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "thosscan/src/index.html"
      - "thosscan/app.js"
      - "thosscan/word-export.js"
      - "thosscan/word-export.test.mjs"
      - "thosscan/vite.config.mjs"
      - ".github/workflows/thosscan-browser-preview.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Instal·lar dependències
        working-directory: thosscan
        run: npm install --no-audit --no-fund
      - name: Comprovar exportació Word
        working-directory: thosscan
        run: node --test word-export.test.mjs
      - name: Compilar ESM per al navegador
        working-directory: thosscan
        run: npx --yes vite@7.1.0 build src --outDir ../dist --emptyOutDir --base=./ --config vite.config.mjs
      - name: Incloure models OCR locals (cat, spa, eng)
        working-directory: thosscan
        run: |
          set -euo pipefail
          mkdir -p dist/models
          for lang in cat spa eng; do
            curl --fail --location --retry 3 --silent --show-error \
              "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/${lang}.traineddata" \
              -o "dist/models/${lang}.traineddata"
            test "$(stat -c%s "dist/models/${lang}.traineddata")" -gt 100000
            gzip -n "dist/models/${lang}.traineddata"
            gzip -t "dist/models/${lang}.traineddata.gz"
          done
      - name: Incloure documentació i llicències
        working-directory: thosscan
        run: |
          mkdir -p dist/licenses
          cp licenses/* dist/licenses/
          cp THOSsCAN.md THIRD_PARTY_NOTICES.md WORD_EXPORT.md dist/
      - name: Comprovar resultat
        run: |
          test -f thosscan/dist/index.html
          test -d thosscan/dist/assets
          find thosscan/dist -type f -printf '%p %s bytes\n' | sort
      - name: Publicar aplicació a la ruta oficial
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p thosscan/assets thosscan/models
          rsync -a --delete thosscan/dist/assets/ thosscan/assets/
          rsync -a --delete thosscan/dist/models/ thosscan/models/
          cp thosscan/dist/index.html thosscan/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thosscan/index.html thosscan/assets thosscan/models
          if ! git diff --cached --quiet; then
            git commit -m "build(thosscan): publish OCR browser app [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: thosscan-browser
          path: thosscan/dist/
          retention-days: 7
