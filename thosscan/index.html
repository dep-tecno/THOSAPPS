<html lang="ca">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="THOSsCAN: conversió local de documents escanejats a Word i Excel.">
<title>THOSsCAN · Conversió de documents</title>
<link rel="canonical" href="https://tecno-apps.cat/thosscan/">
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#e8f5fa;background:#0d2635}*{box-sizing:border-box}body{margin:0}header{background:#102c3e;border-bottom:2px solid #205267;padding:10px 20px;display:flex;align-items:center;gap:10px}header a{color:inherit;text-decoration:none}.app-brand{display:flex;align-items:center;gap:10px}.app-brand img{height:32px;width:auto;object-fit:contain;border-radius:6px}h1{font-size:22px;margin:0}h1 span{color:#63d5e5}main{max-width:860px;margin:32px auto;padding:0 18px}.card{background:#163547;border:1px solid #35596b;border-radius:15px;padding:26px;margin-bottom:18px}h2{margin:0 0 12px;font-size:23px}p{line-height:1.6;color:#bdd5de}.drop{border:2px dashed #4b8495;border-radius:12px;text-align:center;padding:34px 20px;background:#102e40;cursor:pointer}.drop.drag{border-color:#69e4f4;background:#1b4b5a}.drop strong{display:block;font-size:18px}.drop small{display:block;margin:8px;color:#afcad5}input[type=file]{position:absolute;width:1px;height:1px;opacity:0}label{display:block;font-weight:650;margin:18px 0 8px}select,button{font:inherit;border-radius:9px;padding:12px 14px}select{width:100%;background:#102b3d;color:#fff;border:1px solid #527386}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}button{border:0;background:#007c97;color:white;font-weight:700;cursor:pointer}button:disabled{background:#416473;color:#b4cad3;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.status{margin-top:16px;color:#bcd4dc}.credits{text-align:center;font-size:12px;color:#92b6c5;margin:20px 0}.credits a{color:#7dd9e9;text-underline-offset:3px}@media(max-width:600px){.row{grid-template-columns:1fr}.card{padding:18px}}
</style>
<style>
progress{display:block;width:100%;height:10px;margin-top:20px;accent-color:#63d5e5}progress[hidden]{display:none}#cancel{background:transparent;border:1px solid #638b9b;color:#d9edf4}#cancel:disabled{opacity:.6}.drop[aria-disabled="true"]{opacity:.65;cursor:wait}
</style>

<body>
<header><a class="app-brand" href="https://tecno-apps.cat/" target="_top" aria-label="THOSsCAN · Torna a tecno-apps.cat"><img src="/thosscan/thosscan.svg" width="32" height="32" alt=""><h1>THOS<span>sCAN</span></h1></a></header>
<main>
<section class="card"><h2>Converteix un document</h2><p>Carrega un PDF o una imatge i tria el format de sortida. La conversió es fa al navegador.</p>
<label class="drop" id="drop" for="file"><strong>📄 Arrossega aquí el document</strong><small>o clica per seleccionar un PDF, JPG o PNG</small><span id="filename">Cap fitxer seleccionat</span></label>
<input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png">
<div class="row"><div><label for="lang">Idioma</label><select id="lang"><option value="cat">Català</option><option value="spa">Castellà</option><option value="eng">Anglès</option></select></div><div><label for="format">Format de sortida</label><select id="format"><option value="docx">Word (.docx)</option><option value="xlsx">Excel (.xlsx)</option></select></div></div>
<div class="actions"><button id="convert" disabled>Convertir</button><button id="cancel" type="button" hidden>Cancel·lar</button><button id="download" hidden disabled>📥 Descarregar</button><button id="drive" hidden type="button">☁️ Obrir Google Drive</button></div>
<progress id="progress" aria-label="Progrés de la fase actual" hidden></progress>
<p id="status" class="status" role="status" aria-live="polite">Selecciona un document per preparar la conversió.</p>
</section>
<p class="credits">Motor OCR: <a href="https://github.com/scribeocr/scribe.js" target="_blank" rel="noopener noreferrer">Scribe.js</a></p>
</main>
</body></html>
